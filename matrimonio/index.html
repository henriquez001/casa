<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matrimonio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F1E7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Conti del Matrimonio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&display=swap">
<style>
/* Layout: una colonna da app (max 760px), titolo grande per scheda, tab bar fissa in basso su materiale traslucido. Firma: i numeri importanti in Bodoni corsivo, come su una partecipazione, e una fascia di colori d'autunno sulla card principale. Palette volutamente solo chiara, come richiesto. */
:root{
  color-scheme:light;
  --bg:#F8F1E7; --surface:#FFFCF7; --fg:#2B1C16; --muted:#6C584C; --line:#E8D9C6;
  --accent:#7A2B2E; --accent-fg:#FFFCF7; --accent-soft:#F3E2DA;
  --copper:#A8521F; --ochre:#C8902E; --olive:#5E6E36;
  --good:#4E6630; --warn:#8F5208; --bad:#A3302A; --bad-soft:#F6E0DA; --warn-soft:#F7E8D1; --good-soft:#E8EEDC;
  --bar:rgba(255,252,247,.82);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;font-weight:700;margin:20px 0 4px;text-wrap:balance}
h2{font-size:20px;letter-spacing:-.01em;font-weight:650;margin:28px 0 10px;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.pad{padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.hidden{display:none}

/* Hero */
.hero{padding:24px 18px 20px;display:grid;gap:14px;position:relative;overflow:hidden;background:linear-gradient(180deg,#FBEFE3 0%,var(--surface) 70%)}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--accent) 0 25%,var(--copper) 25% 50%,var(--ochre) 50% 75%,var(--olive) 75% 100%)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.display{font-family:var(--font-display);font-style:italic;font-weight:500;letter-spacing:-.01em;line-height:1}
.hero .total{font-size:52px}
.hero .days{font-size:20px;color:var(--copper)}
.hero .total{color:var(--accent)}
.bar-row:nth-child(4n+2) .bar-track i{background:var(--copper)}
.bar-row:nth-child(4n+3) .bar-track i{background:var(--ochre)}
.bar-row:nth-child(4n+4) .bar-track i{background:var(--olive)}
h1{color:var(--accent)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.meter.over i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat b{display:block;font-size:20px;font-weight:650;margin-top:2px}
@media (min-width:620px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Bars */
.bars{display:grid;gap:12px}
.bar-row{display:grid;gap:5px}
.bar-row .lbl{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.bar-track{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* Lists */
.list{display:grid}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-head{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 4px 6px 16px}
.item-main{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:10px}
.item-main .t{flex:1;min-width:0}
.item-main .t span{display:block;overflow-wrap:anywhere}
.item-main .meta{font-size:13px;color:var(--muted)}
.amount{font-weight:600;white-space:nowrap}
.x{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:22px;cursor:pointer}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.x svg{width:16px;height:16px}
.chev{width:12px;height:12px;flex:none;color:var(--muted);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.open > .item-head .chev,.open > .cat-head .chev{transform:rotate(90deg)}
.editor{padding:4px 16px 18px;display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.editor .full{grid-column:1/-1}
@media (max-width:460px){.editor{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--accent);margin:0}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}

/* Category */
.cat{margin-bottom:12px;overflow:hidden}
.cat-head{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 16px;min-height:60px}
.cat-head .item-main .t span:first-child{font-weight:650}
.cat-body{border-top:1px solid var(--line)}
.cat-foot{padding:8px 12px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* Buttons */
.btn{font:inherit;font-size:16px;font-weight:600;min-height:44px;padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:8px;transition:transform .1s ease-out}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.plain{background:none;padding-inline:10px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:active,.x:active,.item-main:active,.tab:active{transform:scale(.97)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* Pills */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--line);color:var(--muted)}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:10px;padding:2px;margin:6px 0 16px}
.seg button{font:inherit;font-size:14px;font-weight:600;min-height:36px;border:0;border-radius:8px;background:none;color:var(--fg);cursor:pointer}
.seg button[aria-selected=true]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{font:inherit;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;min-height:50px;cursor:pointer;font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:var(--accent)}
@media (prefers-reduced-transparency: reduce){.tabbar,.toast{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface)}}
@media (prefers-contrast: more){.tabbar{background:var(--surface);border-top:2px solid var(--fg)}.card{border-color:var(--muted)}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;z-index:30;background:var(--fg);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);transition:opacity .2s ease-out,transform .3s cubic-bezier(.2,.8,.2,1);font-size:15px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{font:inherit;font-weight:700;border:0;background:none;color:var(--bg);min-height:40px;padding:0 12px;cursor:pointer;text-decoration:underline}

.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tables{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tables .card ul{margin:0;padding:0 16px 14px;list-style:none;display:grid;gap:4px;font-size:15px}
.note{font-size:13px;color:var(--muted);margin:10px 4px 0}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)}
.task{display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 4px 4px 16px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task.done .grow{color:var(--muted);text-decoration:line-through}
.task label{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;padding:8px 0}
.preview{margin-top:12px}
.preview textarea{min-height:180px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px}
.scroll{overflow-x:auto}
table.scen{width:100%;border-collapse:collapse;font-size:15px}
table.scen td,table.scen th{padding:10px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.scen th:first-child,table.scen td:first-child{text-align:left}
table.scen thead th{border-top:0;color:var(--muted);font-weight:600;font-size:13px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.btn:active,.x:active,.item-main:active,.tab:active{transform:none}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastBtn" type="button" hidden>Annulla</button></div>
<div class="tabbar"><nav role="tablist" aria-label="Sezioni" id="tabs"></nav></div>

<script>
(() => {
'use strict';
/* ---------- utility ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const eur = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const eur2 = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR', maximumFractionDigits:2});
const fmt = n => eur.format(Math.round(n || 0));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const ICON_X = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>';

/* ---------- dati predefiniti ---------- */
const MODES = {fisso:'Costo fisso', adulto:'Per adulto', bambino:'Per bambino', ospite:'Per ospite', tavolo:'Per tavolo'};
const STATI = {da:'Da cercare', rich:'Preventivo richiesto', ric:'Preventivo ricevuto', scelto:'Scelto', firmato:'Contratto firmato', saldato:'Saldato'};
const STATO_PILL = {da:'mute', rich:'warn', ric:'warn', scelto:'', firmato:'good', saldato:'good'};

function I(id, nome, mode, stima, qty){ return {id, nome, mode, stima, qty: qty || 1, prev:'', fornitore:'', contatto:'', stato:'da', pagato:0, scadenza:'', paga:'coppia', note:''}; }
function defaultCats(){ return [
  {id:'c-rito', nome:'Rito e documenti', items:[
    I('i-pubbl','Pubblicazioni e marche da bollo','fisso',40),
    I('i-comune','Diritti del Comune (rito civile o sede esterna)','fisso',300),
    I('i-parr','Offerta alla parrocchia','fisso',300),
    I('i-corso','Corso prematrimoniale','fisso',50),
    I('i-libretti','Libretti della cerimonia','fisso',80)]},
  {id:'c-ricev', nome:'Location e ricevimento', items:[
    I('i-loc','Affitto location','fisso',2500),
    I('i-menuA','Menu adulti','adulto',110),
    I('i-menuB','Menu bambini','bambino',45),
    I('i-forn','Pasti fornitori (fotografo, musica…)','fisso',40,6),
    I('i-bar','Open bar','adulto',15),
    I('i-torta','Torta nuziale','ospite',6),
    I('i-taglio','Diritto di taglio torta','ospite',3),
    I('i-confett','Confettata','fisso',400),
    I('i-mance','Mance allo staff','fisso',200)]},
  {id:'c-abiti', nome:'Abiti e bellezza', items:[
    I('i-abito1','Abito sposa','fisso',2500),
    I('i-ritocchi','Ritocchi sartoriali','fisso',200),
    I('i-acc1','Scarpe, velo e accessori sposa','fisso',500),
    I('i-abito2','Abito sposo','fisso',1200),
    I('i-acc2','Scarpe e accessori sposo','fisso',300),
    I('i-trucco','Trucco e parrucco (con prova)','fisso',450),
    I('i-barb','Barbiere','fisso',60)]},
  {id:'c-foto', nome:'Foto e video', items:[
    I('i-fot','Fotografo','fisso',2500),
    I('i-vid','Videomaker','fisso',2000),
    I('i-album','Album','fisso',500),
    I('i-drone','Riprese con drone','fisso',300)]},
  {id:'c-musica', nome:'Musica', items:[
    I('i-mcer','Musica per la cerimonia','fisso',400),
    I('i-band','Band o DJ per il ricevimento','fisso',1500),
    I('i-siae','SIAE','fisso',250),
    I('i-audio','Impianto audio e luci','fisso',300)]},
  {id:'c-fiori', nome:'Fiori e allestimenti', items:[
    I('i-bouq','Bouquet','fisso',180),
    I('i-bott','Bottoniere','fisso',60),
    I('i-fchiesa','Fiori per il rito','fisso',600),
    I('i-centro','Centrotavola','tavolo',70),
    I('i-allest','Allestimento location','fisso',800),
    I('i-tabl','Tableau de mariage','fisso',150)]},
  {id:'c-carta', nome:'Partecipazioni e stampa', items:[
    I('i-save','Save the date','fisso',80),
    I('i-part','Partecipazioni (con buste)','fisso',4.5,60),
    I('i-segn','Segnaposto','ospite',1.5),
    I('i-menu','Menu stampati','tavolo',15),
    I('i-franc','Francobolli e spedizioni','fisso',60)]},
  {id:'c-bomb', nome:'Bomboniere', items:[
    I('i-bomb','Bomboniere','ospite',12),
    I('i-sacch','Sacchetti di confetti','ospite',3)]},
  {id:'c-fedi', nome:'Fedi e gioielli', items:[
    I('i-fedi','Fedi','fisso',1200),
    I('i-incis','Incisione','fisso',50)]},
  {id:'c-trasp', nome:'Trasporti e ospitalità', items:[
    I('i-auto','Auto degli sposi','fisso',400),
    I('i-nav','Navetta ospiti','fisso',600),
    I('i-allogg','Alloggio ospiti da fuori','fisso',0),
    I('i-suite','Notte di nozze','fisso',250),
    I('i-welcome','Welcome bag','ospite',0)]},
  {id:'c-serv', nome:'Servizi', items:[
    I('i-wp','Wedding planner','fisso',2500),
    I('i-anim','Animazione bambini','fisso',300),
    I('i-ass','Assicurazione matrimonio','fisso',150)]},
  {id:'c-viaggio', nome:'Viaggio di nozze', items:[
    I('i-volo','Voli','fisso',2000),
    I('i-hotel','Alloggi','fisso',2500),
    I('i-extra','Escursioni ed extra','fisso',800)]}
];}
function defaultTasks(){
  const F = {
    '12 mesi o più':['Fissare budget e data','Scegliere il tipo di rito','Prima bozza della lista ospiti','Prenotare la location','Valutare un wedding planner'],
    '9–12 mesi':['Prenotare fotografo e videomaker','Prenotare la musica','Scegliere il catering','Iniziare a cercare gli abiti'],
    '6–9 mesi':['Ordinare l\'abito','Prenotare il fiorista','Scegliere i testimoni','Prenotare il viaggio di nozze','Inviare i save the date'],
    '4–6 mesi':['Ordinare le partecipazioni','Fare il corso prematrimoniale','Prenotare trucco e parrucco','Scegliere le fedi','Prenotare i trasporti','Ordinare le bomboniere'],
    '2–3 mesi':['Spedire le partecipazioni','Richiedere documenti e pubblicazioni','Degustazione del menu','Prova trucco e parrucco','Scegliere la musica della cerimonia'],
    'Ultimo mese':['Raccogliere le conferme','Preparare tableau e segnaposto','Comunicare i numeri definitivi al catering','Ultime prove degli abiti','Inviare la scaletta ai fornitori'],
    'Ultima settimana':['Preparare le buste per saldi e mance','Consegnare i materiali alla location','Ritirare gli abiti']
  };
  const out = []; Object.entries(F).forEach(([fase, list]) => list.forEach(t => out.push({id:uid(), fase, testo:t, fatto:false}))); return out;
}
function defaultState(){ return {
  settings:{nomeA:'Leo', nomeB:'', data:'', budget:30000, imprevisti:10, stimaAdulti:100, stimaBambini:8, usaLista:true, sposiInclusi:true, perTavolo:10, bustaMedia:120, listaNozze:0},
  entrate:[], cats:defaultCats(), guests:[], tasks:defaultTasks()
};}

/* ---------- stato e salvataggio ---------- */
const LS = 'conti-matrimonio-v1';
let state = defaultState();
let hasLocal = false;
try { const raw = localStorage.getItem(LS); if (raw) { state = Object.assign(defaultState(), JSON.parse(raw)); hasLocal = true; } } catch (e) {}
state.settings = Object.assign(defaultState().settings, state.settings);

const DOCS = {base:['settings','entrate'], spese:['cats'], ospiti:['guests'], checklist:['tasks']};
let db = null, syncState = 'local';
const lastJson = {}, inflight = {}, again = {}, timers = {};
const sliceJson = k => { const o = {}; DOCS[k].forEach(f => o[f] = state[f]); return JSON.stringify(o); };
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
function save(k){ saveLocal(); if (!db) return; clearTimeout(timers[k]); timers[k] = setTimeout(() => { timers[k] = null; flush(k); }, 700); }
async function flush(k){
  if (inflight[k]) { again[k] = true; return; }
  const j = sliceJson(k); if (j === lastJson[k]) return;
  inflight[k] = true;
  try { await db.doc('planner/' + k).set({json:j}); lastJson[k] = j; setSync('ok'); }
  catch (e) {
    setSync('err');
    if (e && e.code === 'unavailable') setTimeout(() => flush(k), 1200 + Math.random() * 1500);
    else if (e && e.code === 'quota_exceeded') toast('Spazio di salvataggio pieno: esporta un backup da Altro › Impostazioni');
  } finally { inflight[k] = false; if (again[k]) { again[k] = false; flush(k); } }
}
function setSync(s){ syncState = s; const el = $('#sync'); if (el) { el.className = 'sync ' + s; el.lastElementChild.textContent = syncLabel(); } }
const syncLabel = () => ({local:'Salvato in questo browser', ok:'Salvato e sincronizzato', err:'Sincronizzazione non riuscita, salvato qui'})[syncState];

(async () => {

const S = () => state.settings;
const nome = w => w === 'A' ? (S().nomeA || 'Sposo/a 1') : (S().nomeB || 'Sposo/a 2');
const PAGA = () => ({coppia:'Coppia', famA:'Famiglia di ' + nome('A'), famB:'Famiglia di ' + nome('B'), altro:'Altro'});

function counts(adultOverride){
  let adulti, bambini, neonati = 0, fromList = false;
  const g = state.guests.filter(x => x.rsvp !== 'no');
  if (S().usaLista && state.guests.length) {
    fromList = true;
    adulti = g.filter(x => x.tipo === 'adulto').length + (S().sposiInclusi ? 2 : 0);
    bambini = g.filter(x => x.tipo === 'bambino').length;
    neonati = g.filter(x => x.tipo === 'neonato').length;
  } else {
    adulti = num(S().stimaAdulti) + (S().sposiInclusi ? 2 : 0);
    bambini = num(S().stimaBambini);
  }
  if (adultOverride != null) { const ratio = adulti ? bambini / adulti : 0; adulti = adultOverride; bambini = Math.round(adultOverride * ratio); }
  const ospiti = adulti + bambini;
  const tavoli = Math.ceil(ospiti / Math.max(1, num(S().perTavolo) || 10));
  return {adulti, bambini, neonati, ospiti, tavoli, fromList};
}
function unitOf(it){ return it.prev !== '' && it.prev != null ? num(it.prev) : num(it.stima); }
function mult(it, c){ return ({fisso:1, adulto:c.adulti, bambino:c.bambini, ospite:c.ospiti, tavolo:c.tavoli})[it.mode] * (num(it.qty) || 1); }
function cost(it, c){ return unitOf(it) * mult(it, c); }
function totals(c){
  c = c || counts();
  let sub = 0, pagato = 0, residuo = 0; const perCat = [], perPaga = {};
  state.cats.forEach(cat => {
    let t = 0;
    cat.items.forEach(it => { const v = cost(it, c); t += v; pagato += num(it.pagato); residuo += Math.max(0, v - num(it.pagato)); perPaga[it.paga] = (perPaga[it.paga] || 0) + v; });
    sub += t; perCat.push({cat, t});
  });
  const imp = sub * num(S().imprevisti) / 100;
  const ospitiEsterni = Math.max(0, c.adulti - (S().sposiInclusi ? 2 : 0));
  const buste = num(S().bustaMedia) * ospitiEsterni;
  const contributi = state.entrate.reduce((a, e) => a + num(e.importo), 0);
  const entrate = buste + contributi + num(S().listaNozze);
  return {sub, imp, tot: sub + imp, pagato, residuo, perCat, perPaga, buste, contributi, entrate, netto: sub + imp - entrate, c};
}
function multLabel(it, c){
  const u = eur2.format(unitOf(it));
  const q = num(it.qty) || 1;
  switch (it.mode) {
    case 'adulto': return u + ' × ' + c.adulti + ' adulti' + (q > 1 ? ' × ' + q : '');
    case 'bambino': return u + ' × ' + c.bambini + ' bambini' + (q > 1 ? ' × ' + q : '');
    case 'ospite': return u + ' × ' + c.ospiti + ' ospiti' + (q > 1 ? ' × ' + q : '');
    case 'tavolo': return u + ' × ' + c.tavoli + ' tavoli' + (q > 1 ? ' × ' + q : '');
    default: return q > 1 ? u + ' × ' + q : '';
  }
}

function vScadenze(){
  const c = counts(); const today = new Date().toISOString().slice(0, 10);
  const in30 = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
  const rows = [];
  state.cats.forEach(cat => cat.items.forEach(it => { const v = cost(it, c); const r = v - num(it.pagato); if (r > 0.5 && v > 0) rows.push({cat, it, v, r}); }));
  rows.sort((a, b) => (a.it.scadenza || '9999') .localeCompare(b.it.scadenza || '9999') || b.r - a.r);
  const dated = rows.filter(x => x.it.scadenza), undated = rows.filter(x => !x.it.scadenza);
  const late = dated.filter(x => x.it.scadenza < today), soon = dated.filter(x => x.it.scadenza >= today && x.it.scadenza <= in30);
  const sum = a => a.reduce((s, x) => s + x.r, 0);
  const P = PAGA();
  const perP = {}; rows.forEach(x => perP[x.it.paga] = (perP[x.it.paga] || 0) + x.r);
  const row = x => { const d = x.it.scadenza; const cls = !d ? 'mute' : d < today ? 'bad' : d <= in30 ? 'warn' : '';
    const dTxt = d ? new Date(d + 'T12:00:00').toLocaleDateString('it-IT', {day:'numeric', month:'short', year:'numeric'}) : 'Senza data';
    return `<div class="item"><div class="item-head" style="padding-right:4px"><button class="item-main" type="button" data-act="goto-item" data-cat="${x.cat.id}" data-id="${x.it.id}"><span class="t"><span>${esc(x.it.nome)}</span><span class="meta">${esc(x.cat.nome)} · ${esc(P[x.it.paga])}${num(x.it.pagato) ? ' · pagato ' + fmt(x.it.pagato) : ''}</span></span><span style="text-align:right"><span class="amount num" style="display:block">${fmt(x.r)}</span><span class="pill ${cls}">${d && d < today ? 'Scaduta · ' : ''}${dTxt}</span></span></button><button class="btn plain small" type="button" data-act="paid" data-id="${x.it.id}" aria-label="Segna ${esc(x.it.nome)} come saldato">Saldato</button></div></div>`; };
  return `<h1>Scadenze</h1><p class="sub">Restano da pagare <b class="num">${fmt(sum(rows))}</b>${late.length ? ` · <span style="color:var(--bad)">${late.length} scadute</span>` : ''}</p>
  <div class="stats"><div class="stat"><span class="small muted">Scadute</span><b class="num" style="color:var(--${late.length ? 'bad' : 'fg'})">${fmt(sum(late))}</b></div><div class="stat"><span class="small muted">Entro 30 giorni</span><b class="num">${fmt(sum(soon))}</b></div><div class="stat"><span class="small muted">Senza data</span><b class="num">${fmt(sum(undated))}</b></div></div>
  <h2>Pagamenti in ordine di scadenza</h2>
  ${rows.length ? `<div class="card list">${rows.map(row).join('')}</div>` : '<div class="card empty"><b>Tutto saldato</b>Non ci sono pagamenti in sospeso.</div>'}
  <p class="note">Imposta la data del saldo e l'importo già versato aprendo la voce nella scheda Spese. «Saldato» registra l'intero importo come pagato.</p>
  ${Object.keys(perP).length ? `<h2>Da pagare per persona</h2><div class="card list">${Object.keys(perP).map(k => `<div class="item"><div class="item-head" style="padding-right:16px"><span class="grow">${esc(P[k])}</span><b class="num">${fmt(perP[k])}</b></div></div>`).join('')}</div>` : ''}

}

const csvCell = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csv = rows => '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
const it2 = n => (Math.round((n || 0) * 100) / 100).toFixed(2).replace('.', ',');
function groupNuclei(){

  state.guests.forEach(g => { const k = (g.nucleo || '').trim() || ('__' + g.id); if (!m.has(k)) m.set(k, {nome:(g.nucleo || '').trim() || g.nome, membri:[], indirizzo:''}); const n = m.get(k); n.membri.push(g); if (!n.indirizzo && g.indirizzo) n.indirizzo = g.indirizzo; });

}
const LATO = x => x === 'entrambi' ? 'Entrambi' : nome(x);

function exporter(act){

      const rows = [['Categoria','Voce','Calcolo','Prezzo stimato','Preventivo','Quantità','Moltiplicatore','Totale','Pagato','Residuo','Stato','Chi paga','Scadenza','Fornitore','Contatto','Note']];
      state.cats.forEach(cat => cat.items.forEach(it => { const v = cost(it, c); rows.push([cat.nome, it.nome, MODES[it.mode], it2(num(it.stima)), it.prev === '' ? '' : it2(num(it.prev)), it.qty, ({fisso:1, adulto:c.adulti, bambino:c.bambini, ospite:c.ospiti, tavolo:c.tavoli})[it.mode], it2(v), it2(num(it.pagato)), it2(Math.max(0, v - num(it.pagato))), STATI[it.stato], P[it.paga], it.scadenza, it.fornitore, it.contatto, it.note]); }));
      const T = totals(c); rows.push([]); rows.push(['','Subtotale','','','','','',it2(T.sub)]); rows.push(['','Imprevisti ' + num(S().imprevisti) + '%','','','','','',it2(T.imp)]); rows.push(['','Totale','','','','','',it2(T.tot)]);
      return {key:'budget', name:'budget-matrimonio.csv', text:csv(rows), mime:'text/csv'};

      return {key:'guests', name:'conteggi-catering.txt', text:t, mime:'text/plain'};
    }
    case 'exp-rsvp': {
      const w = state.guests.filter(g => g.rsvp === 'attesa');
      return {key:'guests', name:'da-sollecitare.txt', mime:'text/plain', text:'Ancora in attesa di risposta (' + w.length + ')\n\n' + (w.map(g => `- ${g.nome}${g.contatto ? ' · ' + g.contatto : ''}`).join('\n') || 'Nessuno.')};
    }
    case 'exp-pay': {
      const rows = [['Scadenza','Voce','Categoria','Totale','Pagato','Da pagare','Chi paga','Fornitore','Contatto']];
      state.cats.forEach(cat => cat.items.forEach(it => { const v = cost(it, c); const r = v - num(it.pagato); if (r > 0.5) rows.push([it.scadenza, it.nome, cat.nome, it2(v), it2(num(it.pagato)), it2(r), P[it.paga], it.fornitore, it.contatto]); }));
      const head = rows.shift(); rows.sort((a, b) => (a[0] || '9999').localeCompare(b[0] || '9999')); rows.unshift(head);
      return {key:'pay', name:'scadenze-pagamenti.csv', text:csv(rows), mime:'text/csv'};
    }
    case 'exp-json': return {key:'json', name:'backup-matrimonio.json', text:JSON.stringify(state, null, 2), mime:'application/json'};
  }
}
async function offer(f){
  ui.preview = f;
  const dl = await downloadsP;
  if (dl) {
    try { await dl.save({filename:f.name, data:new Blob([f.text], {type:f.mime + ';charset=utf-8'})}); toast('File pronto: ' + f.name); ui.preview = null; render(); return; }
    catch (e) { if (e && e.code === 'declined') { ui.preview = null; return; } }
  }
  if (!window.claude) {
    try { const url = URL.createObjectURL(new Blob([f.text], {type:f.mime + ';charset=utf-8'})); const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); ui.preview = null; toast('File scaricato: ' + f.name); render(); return; } catch (e) {}
  }
  render();
}
function previewBox(key){
  const p = ui.preview; if (!p || p.key !== key) return '';
  return `<div class="card pad preview"><div class="row" style="margin-bottom:8px"><b class="grow">${esc(p.name)}</b><button class="btn" type="button" data-act="copy">Copia</button><button class="x" type="button" data-act="close-prev" aria-label="Chiudi anteprima">${ICON_X}</button></div><textarea id="prevTxt" readonly aria-label="Contenuto del file">${esc(p.text.replace(/^﻿/, ''))}</textarea><p class="note" style="margin:8px 0 0">Il download non è disponibile qui: copia il testo e incollalo in un file ${esc(p.name.split('.').pop().toUpperCase())}.</p></div>`;
}

/* ---------- toast con annulla ---------- */
let toastT = null, undoFn = null;
function toast(msg, undo){
  $('#toastText').textContent = msg; undoFn = undo || null; $('#toastBtn').hidden = !undo;
  $('#toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => { $('#toast').classList.remove('show'); undoFn = null; }, undo ? 6000 : 3000);
}
$('#toastBtn').addEventListener('click', () => { if (undoFn) { undoFn(); undoFn = null; } $('#toast').classList.remove('show'); });

/* ---------- eventi ---------- */
const findItem = id => { for (const c of state.cats) { const i = c.items.findIndex(x => x.id === id); if (i > -1) return {cat:c, idx:i, it:c.items[i]}; } return null; };
const NUMF = new Set(['stima','pagato','qty','budget','imprevisti','stimaAdulti','stimaBambini','perTavolo','bustaMedia','listaNozze','importo']);

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; ui.preview = null; try { history.replaceState(null, '', '#' + ui.tab); } catch (_) {} render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  const id = b.dataset.id, act = b.dataset.act;
  switch (act) {
    case 'cat': ui.openCats.has(id) ? ui.openCats.delete(id) : ui.openCats.add(id); render(); break;
    case 'item': ui.openItem = ui.openItem === id ? null : id; render(); break;
    case 'guest': ui.openGuest = ui.openGuest === id ? null : id; render(); break;
    case 'del-cat': { const i = state.cats.findIndex(c => c.id === id); const old = state.cats[i]; state.cats.splice(i, 1); save('spese'); render(); toast('Categoria «' + old.nome + '» rimossa', () => { state.cats.splice(i, 0, old); save('spese'); render(); }); break; }
    case 'del-item': { const f = findItem(id); f.cat.items.splice(f.idx, 1); save('spese'); render(); toast('«' + f.it.nome + '» rimossa', () => { f.cat.items.splice(f.idx, 0, f.it); save('spese'); render(); }); break; }
    case 'add-item': { const cat = state.cats.find(c => c.id === id); const it = I('u-' + uid(), 'Nuova voce', 'fisso', 0); cat.items.push(it); ui.openItem = it.id; save('spese'); render(); const el = document.getElementById('n-' + it.id); if (el) { el.focus(); el.select(); } break; }
    case 'add-cat': { const cat = {id:'u-' + uid(), nome:'Nuova categoria', items:[]}; state.cats.push(cat); ui.openCats.add(cat.id); save('spese'); render(); { const inp = document.getElementById('rc-' + cat.id); if (inp) { inp.focus(); inp.select(); } } break; }
    case 'restore': { const def = defaultCats(); const have = new Set(); state.cats.forEach(c => c.items.forEach(i => have.add(i.id)));
      def.forEach(dc => { let cat = state.cats.find(c => c.id === dc.id); const miss = dc.items.filter(i => !have.has(i.id)); if (!miss.length) return; if (!cat) { cat = {id:dc.id, nome:dc.nome, items:[]}; state.cats.push(cat); } miss.forEach(i => cat.items.push(i)); });
      save('spese'); render(); toast('Voci predefinite ripristinate'); break; }
    case 'scen': break;
    case 'gseg': ui.guestSeg = id; ui.preview = null; render(); break;
    case 'aseg': ui.altroSeg = id; ui.preview = null; render(); break;
    case 'add-guest': { const g = {id:uid(), nome:'', nucleo:'', gruppo:'', lato:'entrambi', tipo:'adulto', rsvp:'attesa', indirizzo:'', contatto:'', allergie:'', tavolo:''}; state.guests.unshift(g); ui.openGuest = g.id; ui.q = ''; save('ospiti'); render(); const el = document.getElementById('gn-' + g.id); if (el) el.focus(); break; }
    case 'bulk': ui.bulk = !ui.bulk; render(); if (ui.bulk) $('#bulkTxt').focus(); break;
    case 'bulk-add': { const lines = $('#bulkTxt').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean); let n = 0;
      lines.forEach(l => { const names = l.split(',').map(s => s.trim()).filter(Boolean); const nucleo = names.length > 1 ? 'Famiglia ' + (names[0].split(' ').slice(-1)[0]) : '';
        names.forEach(nm => { state.guests.push({id:uid(), nome:nm, nucleo, gruppo:'', lato:'entrambi', tipo:'adulto', rsvp:'attesa', indirizzo:'', contatto:'', allergie:'', tavolo:''}); n++; }); });
      ui.bulk = false; save('ospiti'); render(); toast(n + (n === 1 ? ' ospite aggiunto' : ' ospiti aggiunti')); break; }
    case 'del-guest': { const i = state.guests.findIndex(g => g.id === id); const old = state.guests[i]; state.guests.splice(i, 1); save('ospiti'); render(); toast((old.nome || 'Ospite') + ' rimosso', () => { state.guests.splice(i, 0, old); save('ospiti'); render(); }); break; }
    case 'goto-item': { ui.tab = 'spese'; ui.openCats.add(b.dataset.cat); ui.openItem = id; render(); const el = document.getElementById('sc-' + id); if (el) { el.scrollIntoView({block:'center'}); el.focus({preventScroll:true}); } break; }
    case 'paid': { const f = findItem(id); const prevPaid = f.it.pagato, prevStato = f.it.stato; f.it.pagato = Math.round(cost(f.it, counts()) * 100) / 100; f.it.stato = 'saldato'; save('spese'); render(); toast('«' + f.it.nome + '» saldato', () => { f.it.pagato = prevPaid; f.it.stato = prevStato; save('spese'); render(); }); break; }
    case 'add-entrata': state.entrate.push({id:uid(), nome:'', importo:''}); save('base'); render(); { const el = document.getElementById('en-' + state.entrate[state.entrate.length - 1].id); if (el) el.focus(); } break;
    case 'del-entrata': { const i = state.entrate.findIndex(x => x.id === id); const old = state.entrate[i]; state.entrate.splice(i, 1); save('base'); render(); toast('Contributo rimosso', () => { state.entrate.splice(i, 0, old); save('base'); render(); }); break; }
    case 'del-task': { const i = state.tasks.findIndex(x => x.id === id); const old = state.tasks[i]; state.tasks.splice(i, 1); save('checklist'); render(); toast('Attività rimossa', () => { state.tasks.splice(i, 0, old); save('checklist'); render(); }); break; }
    case 'add-task': { const t = $('#ntxt').value.trim(); if (!t) { $('#ntxt').focus(); return; } const fase = $('#nfase').value; let idx = -1; state.tasks.forEach((x, i) => { if (x.fase === fase) idx = i; }); state.tasks.splice(idx + 1, 0, {id:uid(), fase, testo:t, fatto:false}); save('checklist'); render(); toast('Attività aggiunta'); break; }
    case 'reset': ui.confirmReset = true; render(); break;
    case 'reset-no': ui.confirmReset = false; render(); break;
    case 'reset-yes': { const old = clone(state); state = defaultState(); ui.confirmReset = false; Object.keys(DOCS).forEach(save); render(); toast('Dati cancellati', () => { state = old; Object.keys(DOCS).forEach(save); render(); }); break; }
    case 'copy': { const ta = $('#prevTxt'); const txt = ta.value; const ok = () => toast('Copiato negli appunti'); const fb = () => { ta.focus(); ta.select(); toast('Testo selezionato: copialo con Ctrl+C'); };
      try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (_) { fb(); } break; }
    case 'close-prev': ui.preview = null; render(); break;
    default: if (act && act.startsWith('exp-')) { const f = exporter(act); if (f) offer(f); }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.act === 'scen') { ui.scen = +t.value; const o = $('#scenOut'); if (o) o.innerHTML = scenOut(ui.scen); return; }
  if (t.dataset.act === 'q') { ui.q = t.value; render(); return; }
  if (t.dataset.item) { const f = findItem(t.dataset.item); if (!f) return; const k = t.dataset.f; f.it[k] = k === 'prev' ? (t.value === '' ? '' : num(t.value)) : NUMF.has(k) ? num(t.value) : t.value; save('spese'); return; }
  if (t.dataset.g) { const g = state.guests.find(x => x.id === t.dataset.id); if (g) { g[t.dataset.g] = t.value; save('ospiti'); } return; }
  if (t.dataset.e) { const x = state.entrate.find(y => y.id === t.dataset.id); if (x) { x[t.dataset.e] = t.dataset.e === 'importo' ? num(t.value) : t.value; save('base'); } return; }
  if (t.dataset.s && t.type !== 'checkbox') { const k = t.dataset.s; state.settings[k] = NUMF.has(k) ? num(t.value) : t.value; save('base'); return; }
  if (t.dataset.rencat) { const c = state.cats.find(x => x.id === t.dataset.rencat); if (c) { c.nome = t.value; save('spese'); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'task') { const x = state.tasks.find(y => y.id === t.dataset.id); x.fatto = t.checked; save('checklist'); render(); return; }
  if (t.dataset.s && t.type === 'checkbox') { state.settings[t.dataset.s] = t.checked; save('base'); render(); return; }
  if (t.dataset.act === 'imp') { const file = t.files && t.files[0]; if (!file) return; const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (!o || !Array.isArray(o.cats)) throw 0; const old = clone(state); state = Object.assign(defaultState(), o); state.settings = Object.assign(defaultState().settings, o.settings); Object.keys(DOCS).forEach(save); render(); toast('Backup importato', () => { state = old; Object.keys(DOCS).forEach(save); render(); }); } catch (_) { toast('Questo file non è un backup del matrimonio: scegli il file .json esportato da qui'); } };
    r.readAsText(file); return; }
  if (t.dataset.rencat || (t.matches('input,select,textarea') && (t.dataset.item || t.dataset.g || t.dataset.e || t.dataset.s))) setTimeout(render, 0);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.rencat) e.target.blur(); if (e.key === 'Enter' && e.target.id === 'ntxt') document.querySelector('[data-act="add-task"]').click(); });

document.body.insertAdjacentHTML('beforeend', '<div id="dl"></div>');
const renderDL = () => { $('#dl').innerHTML = datalists(); };
const _render = render; render = function(){ _render(); renderDL(); };
render();
})();
