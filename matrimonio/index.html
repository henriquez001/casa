<style>

.lh{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.lh h2{margin:0;font-family:var(--font-script);font-weight:400;font-size:40px;line-height:1.2}
.lh .gr{width:40px;height:1px;background:var(--gold)}
.lh .ey{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.story{display:flex;flex-direction:column;gap:18px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.st .ph{height:220px;background:#A7B08F center/cover no-repeat}.st:nth-child(3) .ph{height:200px;background-color:#CDB898}.st:nth-child(4) .ph{background-color:#9FAA8C}
.st .tx{padding:16px 20px 20px;display:flex;flex-direction:column;gap:4px}
.st .yr{margin:0;font-family:var(--font-display);font-style:italic;font-weight:600;font-size:22px;color:var(--copper)}
.st .tt{margin:0;font-size:17px;font-weight:600}.st .ds{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:6px}
.prog ol{list-style:none;margin:8px 0 0;padding:0;position:relative;display:flex;flex-direction:column}
.prog ol::before{content:"";position:absolute;left:7px;top:22px;bottom:22px;width:1px;background:#C9BFA8}
.prog li{position:relative;display:flex;align-items:center;gap:14px;min-height:64px}
.prog .dot{flex:none;width:15px;height:15px;border-radius:8px;border:1px solid var(--accent);background:var(--surface);display:grid;place-items:center}.prog .dot i{width:7px;height:7px;border-radius:4px;background:var(--accent)}
.prog .ic{flex:none;width:44px;height:44px;border-radius:22px;background:#EEF0E7;color:var(--accent);display:grid;place-items:center}.prog .ic svg{width:24px;height:24px}
.prog .w{display:flex;flex-direction:column;gap:1px;min-width:0}
.prog .o{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:22px;line-height:1.1}.prog .c{font-size:15px;font-weight:600}.prog .d{font-size:13px;color:var(--muted)}
.prog .nt{margin:8px 0 0;font-size:13px;line-height:1.4;color:var(--muted);text-align:center}
.close{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 4px 0}.close p{margin:0}
.entra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(242,236,223,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.entra.on{transform:none}.entra .btn{width:100%;max-width:488px;margin:0 auto;display:flex;min-height:52px;font-size:17px}
@media (prefers-reduced-motion: reduce){.entra{transition:opacity .2s linear;transform:none;opacity:0;pointer-events:none}.entra.on{opacity:1;pointer-events:auto}}
@media (prefers-reduced-transparency: reduce){.entra{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion: reduce){.view.enter{animation:none}.btn,.seg button,.chk span{transition:none}.btn:active{transform:none}.panel{transition:none}}
@media (prefers-reduced-transparency: reduce){.tabbar{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast: more){:root{--line:#B9AF98;--muted:#4F4D40}}
</style>

:root{
  /* colore */
  --bg:#FBF8F1; --paper:#FFFDF7; --surface:#FFFDF7; --field:#FBF8F1;
  --fg:#2B3324; --muted:#56624F; --line:#E2E6D9; --line-2:#CFD8C9;
  --accent:#47604A; --accent-fg:#FBF8F1; --accent-soft:#E3EADF; --sage-2:#7D9580;
  --copper:#8E4A33; --terra-soft:#F4E3DA;
  --gold:#A7B7A5; --ochre:#C9A13A; --olive:#7D9580;
  --good:#47604A; --good-soft:#E3EADF; --warn:#6B5212; --warn-soft:#F7ECC6; --bad:#A0472F; --bad-ink:#8A3A22; --bad-soft:#F6E0D6;
  --c-spese:#A0472F; --c-entrate:#47604A; --c-a:#5E7F8C; --c-b:#B4533A;
  --bulb:#FFE6A0; --glow:#FFC040; --halo:rgba(255,196,80,.26);
  --bar:rgba(251,248,241,.86); --string:rgba(71,96,74,.6);
  /* caratteri */
  --font-display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-ui:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --font-script:"Retro Capsule","Arial Rounded MT Bold",var(--font-ui);
  --font-sc:var(--font-ui);
  /* forme e ombre */
  --r:6px; --r-field:8px; --r-cap:8px; --r-tag:4px;
  --sh-tag:0 6px 16px rgba(33,48,41,.16); --sh-mini:0 3px 10px rgba(33,48,41,.10); --sh-pop:0 14px 40px rgba(33,48,41,.25);
  --filetto:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='8' viewBox='0 0 60 8'><path d='M0 4.3 Q7 1.2 15 4 T31 4.4 T44 3.6 T60 4.1' fill='none' stroke='%23A7B7A5' stroke-width='1.4' stroke-linecap='round'/></svg>");
}
html{font-synthesis:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui)}
button,input,select,textarea{font-family:inherit}
/* --- tipografia --- */
.eyebrow{font-family:var(--font-ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.display{line-height:1.1;font-family:var(--font-display);font-style:normal;font-weight:700;font-variation-settings:"opsz" 96;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
.sub{color:var(--muted)}
/* --- filetto a mano (al posto dei filetti d'oro) --- */
.goldrule,.lh .gr,.cover .rl{width:60px!important;height:8px!important;border:0!important;background:var(--filetto) center/60px 8px no-repeat!important;opacity:1!important}
/* --- lucine accese e alone caldo, in cima a ogni schermata --- */
main#app:not(.land),#app.wrap{position:relative}
main#app:not(.land)::before,#app.wrap::before{content:"";position:absolute;left:0;right:0;top:0;height:320px;pointer-events:none;z-index:0;background:var(--i-luc) center calc(env(safe-area-inset-top,0px) + 8px)/min(86%,440px) auto no-repeat,radial-gradient(70% 80% at 50% 0%,var(--halo),transparent 72%)}
main#app:not(.land)>*,#app.wrap>*{position:relative;z-index:1}
/* --- segnaposto appeso: la scheda di base --- */
.card,.tag{background:var(--paper)!important;border:0!important;border-radius:var(--r)!important;box-shadow:var(--sh-tag);position:relative;overflow:visible!important;margin-top:14px}
.card::before{content:"";position:absolute;top:9px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 1px rgba(33,48,41,.25);z-index:2}
.card::after{content:"";position:absolute;top:-16px;left:50%;width:1.5px;height:29px;margin-left:-.75px;background:var(--string);z-index:2}
.card{padding-top:24px}
/* --- comandi --- */
.btn{border-radius:var(--r-cap);font-weight:700;letter-spacing:.01em;outline:1.5px dashed rgba(71,96,74,.55);outline-offset:-6px}
.btn.primary{outline-color:rgba(251,248,241,.7)}
.btn.plain{outline:0}
.btn.danger{outline-color:rgba(138,58,34,.5)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn:not(.primary):not(.plain):not(.danger){background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:none;color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad-ink)}
.seg{background:var(--accent-soft);border-radius:var(--r-cap);padding:3px}
.seg button{border-radius:var(--r-cap);color:var(--fg)}
.seg button{font-weight:700}
.seg button[aria-checked=true],.seg button[aria-selected=true]{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(33,48,41,.14);outline:1px dashed rgba(71,96,74,.5);outline-offset:-4px}
.chip{border-color:var(--line-2)}
input,select,textarea{background:var(--field);border:1px solid var(--line-2);border-radius:var(--r-field);color:var(--fg)}
input::placeholder,textarea::placeholder{color:#6E7868}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* --- stati --- */
.msg{border-radius:var(--r)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.msg.err{background:var(--bad-soft);color:var(--bad-ink)}
/* --- barra delle schede --- */
.tabbar{background:var(--bar);border-top:1px solid var(--line)}
.tab{color:var(--muted)}
.tab[aria-current=page],.tab[aria-selected=true]{color:var(--accent)}
/* --- avvisi --- */
.toast{background:var(--fg);color:var(--bg);border-radius:var(--r-cap)}
.demo{background:var(--copper);color:#FFFDF7}
@media (prefers-contrast: more){:root{--line:#AFBBAA;--line-2:#8E9B88;--muted:#3F4A3A;--string:#47604A}.card,.tag,.stat,.fund,.st,.prog,.gal{box-shadow:0 0 0 1px var(--muted)!important}}
@media (prefers-reduced-transparency: reduce){.tabbar{background:var(--paper)}}

main#app:not(.land){padding-top:calc(env(safe-area-inset-top,0px) + 92px)}
/* segnaposto: inclinati a mano, entrano appesi */
main#app:not(.land)>.view>.card{--tilt:0deg;transform:rotate(var(--tilt))}
main#app:not(.land)>.view>.card:nth-of-type(odd){--tilt:-1.1deg}
main#app:not(.land)>.view>.card:nth-of-type(even){--tilt:.9deg}
main#app:not(.land)>.view>.card.hero{--tilt:0deg}
@keyframes hang{0%{opacity:0;transform:translateY(-10px) rotate(calc(var(--tilt) * -2.5))}60%{opacity:1}100%{opacity:1;transform:rotate(var(--tilt))}}
.view.enter>.card{animation:hang .55s cubic-bezier(.34,1.45,.5,1) both}
.view.enter>.card:nth-of-type(2){animation-delay:.05s}.view.enter>.card:nth-of-type(3){animation-delay:.1s}.view.enter>.card:nth-of-type(n+4){animation-delay:.15s}
@media (prefers-reduced-motion: reduce){.view.enter>.card{animation:none}}
/* titoli */
h1.t,.mh h1{font-family:var(--font-script);font-weight:400;font-size:34px;line-height:1.15;color:var(--accent)}
.names{font-family:var(--font-script);font-weight:400;color:var(--accent);font-size:34px;line-height:1.1}
.names .amp{font-family:var(--font-display);font-style:normal;font-weight:600;font-size:20px;color:var(--muted);margin:2px 0}
.names.row{font-size:30px}
.greet .hi{font-family:var(--font-script);font-weight:400;font-size:25px;line-height:1.2;color:var(--accent)}
.lh h2{font-family:var(--font-script);font-weight:400;font-size:30px;color:var(--accent)}
.lh h2[style]{font-size:32px!important}
.lh .ey,.cover .kick{font-family:var(--font-ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.sect .h,.sfide .sfh b{font-weight:600}
/* date e cifre: Old Standard TT corsivo terracotta */
.days,.place .when,.st .yr,.tot b,.sfide .sfh span,.prog .o,.cd b{font-family:var(--font-display);font-style:normal;font-weight:700;font-variation-settings:"opsz" 96;letter-spacing:-.01em;color:var(--copper);font-variant-numeric:lining-nums tabular-nums}
.prog .o{color:var(--fg)}
/* disegni a linea */
.olive .olw{position:relative;display:block;width:100%;max-width:460px}.olive .olw img{display:block;width:100%;height:auto}.olive .olw img+img{position:absolute;inset:0;height:100%}
.elx{display:block;width:auto;height:64px;margin-bottom:2px}
.mh{flex-wrap:wrap}.mh::before{content:"";flex-basis:100%;height:64px;background:var(--i-lam) left bottom/auto 64px no-repeat}
.dk{display:flex;align-items:flex-end;gap:10px;margin-bottom:2px}.dk img{display:block;width:auto}.dk img:first-child{height:84px}.dk img+img{height:52px}
.sprig{width:96px!important;height:auto}
.prog .ic{background:none!important;width:48px;height:48px}.prog .ic img{width:44px;height:44px;object-fit:contain}
.prog ol::before{background:var(--line-2)}
.prog .dot{border-color:var(--accent);background:var(--paper)}
/* la storia e il programma diventano segnaposto anche loro */
.st,.prog{background:var(--paper);border:0;border-radius:var(--r);box-shadow:var(--sh-tag)}
.st .ph{background:var(--i-uli) center/auto 46% no-repeat,var(--accent-soft)!important}
.st .ph[style]{background-size:cover!important}
/* copertina: carta panna, gazebi con le luci accese, alone */
.cover:not([style]){background:radial-gradient(80% 50% at 50% 0%,rgba(255,196,80,.24),transparent 75%),var(--bg);justify-content:center}
.cover .cvw{position:relative;display:block;width:100%;max-width:560px;align-self:center;margin-top:calc(env(safe-area-inset-top,0px) + 36px)}
.cover .cvw img{display:block;width:100%;height:auto}.cover .cvw .cvl{position:absolute;inset:0;height:100%}
.cover:not([style]) .cover-in{background:none;color:var(--fg);padding-top:20px;justify-content:flex-start}
.cover:not([style]) h1{font-family:var(--font-script);font-weight:400;color:var(--accent);font-size:clamp(32px,10vw,50px)}
.cover h1 .e{font-family:var(--font-display);font-style:normal;font-weight:600;font-size:24px;color:var(--muted)}
.cover:not([style]) .dt{font-family:var(--font-display);font-style:normal;font-weight:700;font-variation-settings:"opsz" 96;letter-spacing:-.01em;color:var(--fg)}
.cover:not([style]) .cd b{color:var(--fg)}
.cover:not([style]) .cd span{color:var(--muted);opacity:1;font-weight:600}
.cover:not([style]) .dn{color:var(--accent);opacity:1}
.entra{background:rgba(251,248,241,.9)}
/* partecipa */
.chk span{border-radius:6px;border-color:var(--line-2)}
.chk[aria-checked=true] span{background:var(--accent);border-color:var(--accent)}
.allg{background:var(--field);border-radius:var(--r-field)}
.chip{border-radius:var(--r-cap);background:var(--paper);font-weight:700}
.chips .chip[aria-pressed=true],.flt button[aria-pressed=true]{outline:1px dashed currentColor;outline-offset:-4px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.person{border-top-color:var(--line)}
/* scatta e galleria */
.big{border:6px solid var(--accent-soft);box-shadow:0 0 0 1px var(--line-2),0 0 30px rgba(255,196,80,.35)}
.opt{border:1px solid var(--line-2);background:var(--paper);border-radius:14px}
.opt.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stat{background:var(--field);border-radius:var(--r-field)}
.stat .w{color:var(--copper)}
.pbar{background:var(--accent-soft);border-radius:999px}.pbar i{border-radius:999px}
.ch{border-top-color:var(--line)}
.ck{border-color:var(--line-2)}
.cam{border-color:var(--accent);color:var(--accent)}
.flt button{border-color:var(--line-2);background:var(--paper)}
.flt button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.nuove{border-radius:var(--r-cap)}
.thumbs i{background:var(--i-uli) center/auto 60% no-repeat,var(--accent-soft)}
.thumbs i[style]{background-size:cover}
.thumbs i.video,.thumbs i.vocale{background-color:#D2DBCC}
.gal{border-radius:var(--r);box-shadow:var(--sh-mini)}
.tile{background:var(--i-uli) center/auto 44% no-repeat,var(--accent-soft)}
.tile:nth-child(3n+2){background-color:#E9E4D3}.tile:nth-child(3n){background-color:#D2DBCC}
.tile.vocale{background:var(--paper)}
.tile .pv{color:#6B3A26;background:rgba(251,240,232,.95)}
</style>
</head>

var lastErr = '';
// Il dettaglio tecnico diventa una frase chiara; il testo originale resta piccolo, per chi deve capire il guasto.
function errSpiega(x){
  if (/fetch|load failed|networkerror|riserva bloccato|secondo tentativo/i.test(x)) return 'Questo telefono non riesce a raggiungere Google: prova con un’altra rete (Wi‑Fi o dati) o senza VPN o blocco pubblicità.';
  if (/12 secondi/.test(x)) return 'Google non ha risposto in tempo: riprova tra poco.';
  if (/da aggiornare/.test(x)) return 'Google ha risposto con una pagina invece dei dati: gli sposi devono controllare la cassetta.';
  return '';
}
function errTxt(base, retry){ S.retry = retry || null; var sp = lastErr ? errSpiega(lastErr) : ''; return base + (sp ? '<br><span style="font-size:14px">' + esc(sp) + '</span>' : '') + (lastErr ? ' <span style="opacity:.6;font-size:12px">(' + esc(lastErr.replace('canale di riserva bloccato', 'secondo tentativo non riuscito')) + ')</span>' : '') + (retry ? '<button class="btn retry" type="button" data-act="riprova">Riprova</button>' : ''); }
function api(params){
  if (DEMO) return new Promise(function(res){ setTimeout(function(){
    if (params.a === 'invito') res(params.codice === 'PROVA1' ? {ok:true, invito:demoGet()} : {ok:false, motivo:'codice'});
    else if (params.a === 'cerca') res(/^carla$|^mario$|^luca$/i.test(params.nome.trim()) && /^(rossi)?$/i.test((params.cognome || '').trim()) ? {ok:true, invito:demoGet()} : {ok:false, motivo:'nontrovato'});
    else res({ok:false}); }, 350); });
  // Se la rete del telefono perde la richiesta (succede appena l'app si apre o torna in primo piano),
  // riprovo da solo una volta dopo 3 secondi prima di mostrare l'errore. Non dopo un'attesa di 12 secondi.
  return viaRete(params).catch(function(e){
    if (/12 secondi/.test(String(e && e.message || e))) throw e;
    return new Promise(function(ok){ setTimeout(ok, 3000); }).then(function(){ return viaRete(params); });
  });
}
// Ogni richiesta aspetta al massimo 12 secondi. Se la richiesta diretta fallisce (browser che blocca, pagina di Google al posto dei dati)
// si usa il canale di riserva: la cassetta risponde come script (JSONP). Se il canale di riserva funziona, lo si usa da subito.
var useJP = store.get('cassetta-jsonp') === '1', JP = 0;
function leggiTesto(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text().then(function(t){ try { return JSON.parse(t); } catch (e) { throw new Error('pagina al posto dei dati'); } }); }
function fetchJ(u, opt){
  var ac = window.AbortController ? new AbortController() : null, t = ac ? setTimeout(function(){ ac.abort(); }, 12000) : 0;
  return fetch(u, Object.assign({redirect:'follow', signal:ac ? ac.signal : undefined}, opt || {})).then(leggiTesto)
    .then(function(o){ clearTimeout(t); return o; }, function(e){ clearTimeout(t); throw (e && e.name === 'AbortError') ? new Error('nessuna risposta in 12 secondi') : e; });
}
// Google a volte fallisce la prima richiesta dopo l'apertura: riprovo fino a 3 volte prima di passare al canale di riserva.
function fetchRip(u, opt){
  var n = 0;
  var go = function(){ return fetchJ(u, Object.assign({cache:'no-store'}, opt || {})).catch(function(e){ n++; if (n >= 3 || /12 secondi/.test(e && e.message || '')) throw e; return new Promise(function(ok){ setTimeout(ok, 700 * n); }).then(go); }); };
  return go();
}
function jsonp(params){
  return new Promise(function(res, rej){
    var cb = '_cas' + (++JP) + '_' + Math.floor(Date.now()).toString(36), s = document.createElement('script'), fatto = false;
    var fine = function(){ fatto = true; clearTimeout(t); window[cb] = function(){}; s.remove(); }; // resta una funzione vuota: se la risposta arriva tardi non dà errore
    var t = setTimeout(function(){ if (!fatto) { fine(); rej(new Error('nessuna risposta in 12 secondi')); } }, 12000);
    window[cb] = function(o){ if (!fatto) { fine(); res(o); } };
    s.onerror = function(){ if (!fatto) { fine(); rej(new Error('secondo tentativo non riuscito')); } };
    s.onload = function(){ setTimeout(function(){ if (!fatto) { fine(); rej(new Error('cassetta da aggiornare')); } }, 0); };
    s.src = CONFIG.cassetta + '?' + new URLSearchParams(Object.assign({}, params, {callback:cb})).toString();
    document.head.appendChild(s);
  });
}
function viaRete(params){
  lastErr = '';
  var u = CONFIG.cassetta + '?' + new URLSearchParams(params).toString();
  var riserva = function(e1){ return jsonp(params).then(function(o){ useJP = true; store.set('cassetta-jsonp', '1'); return o; }, function(e2){ lastErr = (e1 ? (e1.message || e1) + '; ' : '') + (e2.message || e2); throw e2; }); };
  if (useJP) return jsonp(params).catch(function(e){ return fetchRip(u).then(function(o){ useJP = false; store.set('cassetta-jsonp', null); return o; }, function(){ lastErr = e.message || String(e); throw e; }); });
  return fetchRip(u).catch(riserva);
}
function post(body){
  if (DEMO) return new Promise(function(res){ setTimeout(function(){ var r = body.risposta; r.quando = new Date().toISOString(); store.set('invito-demo-risposta', JSON.stringify(r)); res({ok:true, risposta:r}); }, 500); });
  // Invio diretto; se il browser lo blocca, la risposta passa dal canale di riserva. Se la cassetta è occupata riprova fino a 3 volte.
  lastErr = '';
  var tenta = function(n){
    var via = useJP ? jsonp({a:'rispondi', d:JSON.stringify(body)}) : fetchRip(CONFIG.cassetta, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
      .catch(function(e1){ return jsonp({a:'rispondi', d:JSON.stringify(body)}).then(function(o){ useJP = true; store.set('cassetta-jsonp', '1'); return o; }, function(e2){ lastErr = (e1.message || e1) + '; ' + (e2.message || e2); throw e2; }); });
    return via.then(function(r){ if (r && r.motivo === 'occupato' && n < 3) return new Promise(function(ok){ setTimeout(ok, 1500 * (n + 1)); }).then(function(){ return tenta(n + 1); }); return r; });
  };
  return tenta(0);
}

function durTxt(s){ s = Math.round(s || 0); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }

// Coda sul telefono (IndexedDB): se manca la rete i file restano qui e partono da soli appena torna.
var idbP = null;
function idb(){
  if (!idbP) idbP = new Promise(function(ok, ko){
    if (!window.indexedDB) return ko(new Error('no idb'));
    var r = indexedDB.open('matrimonio-media', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('coda', {keyPath:'k'}); };
    r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ ko(r.error); };
  });
  return idbP;
}
function idbDo(mode, fn){ return idb().then(function(db){ return new Promise(function(ok, ko){ var tx = db.transaction('coda', mode), st = tx.objectStore('coda'), req = fn(st); tx.oncomplete = function(){ ok(req && req.result); }; tx.onerror = function(){ ko(tx.error); }; }); }); }
function codaSalva(it){ return idbDo('readwrite', function(st){ return st.put(it); }).catch(function(){}); }
function codaTogli(k){ return idbDo('readwrite', function(st){ return st.delete(k); }).catch(function(){}); }
function codaCarica(){ return idbDo('readonly', function(st){ return st.getAll(); }).then(function(l){ M.coda = (l || []).sort(function(a, b){ return a.k < b.k ? -1 : 1; }); }).catch(function(){}); }

// Foto ridotta sul telefono: 2048 px sul lato lungo, JPEG 0,85 (circa 400–700 KB).
function apriImg(file){
  if (window.createImageBitmap) return createImageBitmap(file, {imageOrientation:'from-image'}).catch(function(){ return imgEl(file); });
  return imgEl(file);
}
function imgEl(file){ return new Promise(function(ok, ko){ var i = new Image(), u = URL.createObjectURL(file); i.onload = function(){ ok(i); }; i.onerror = function(){ ko(new Error('foto')); }; i.src = u; }); }
function disegna(img, lato, q){
  var w = img.width, h = img.height, k = Math.min(1, lato / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function inBlob(c, q){ return new Promise(function(ok){ c.toBlob(function(b){ ok(b); }, 'image/jpeg', q); }); }
function durataVideo(file){ return new Promise(function(ok){ var v = document.createElement('video'), u = URL.createObjectURL(file), fatto = false; var fine = function(d){ if (!fatto) { fatto = true; URL.revokeObjectURL(u); ok(d); } };
  v.preload = 'metadata'; v.muted = true; v.onloadedmetadata = function(){ fine(isFinite(v.duration) ? v.duration : 0); }; v.onerror = function(){ fine(0); }; setTimeout(function(){ fine(0); }, 4000); v.src = u; }); }
function mimeDi(file, tipo){
  var m = String(file.type || '').split(';')[0].toLowerCase(), n = String(file.name || '').toLowerCase();
  if (m) return m === 'video/x-m4v' ? 'video/mp4' : m === 'audio/x-m4a' ? 'audio/mp4' : m;
  if (/\.mov$/.test(n)) return 'video/quicktime'; if (/\.(mp4|m4v)$/.test(n)) return 'video/mp4'; if (/\.webm$/.test(n)) return tipo === 'vocale' ? 'audio/webm' : 'video/webm';
  if (/\.(heic|heif)$/.test(n)) return 'image/heic'; return tipo === 'video' ? 'video/mp4' : 'image/jpeg';
}
function aggiungi(file, tipo, extra){
  extra = extra || {};
  var k = Math.floor(Date.now()).toString(36) + Math.random().toString(36).slice(2, 7);
  var au = autore(), pp = ((S.inv && S.inv.persone) || []).filter(function(x){ return x.nome === au; })[0];
  var base = {k:k, tipo:tipo, sfida:extra.sfida || '', autore:au, pid:pp && !S.inv.anteprima ? pp.id : '', durata:extra.durata || 0, tries:0, prova:!!S.inv.anteprima, c:S.inv.anteprima ? '' : S.inv.c};
  M.err = '';
  var pronto;
  if (tipo === 'foto') pronto = apriImg(file).then(function(img){
    return Promise.all([inBlob(disegna(img, 2048), 0.85), Promise.resolve(disegna(img, 160).toDataURL('image/jpeg', 0.7))]);
  }).then(function(x){ return Object.assign(base, {blob:x[0], mime:'image/jpeg', nome:'foto-' + k + '.jpg', th:x[1]}); },
    function(){ var m = mimeDi(file, 'foto'); if (!/^image\/(jpeg|png|heic|heif|webp)$/.test(m)) throw new Error('Questo file non è una foto che riesco a mandare.'); return Object.assign(base, {blob:file, mime:m, nome:'foto-' + k + '.' + (m.split('/')[1] || 'jpg'), th:''}); });
  else if (tipo === 'video') pronto = durataVideo(file).then(function(d){
    if (d > 35) throw new Error('Il video dura ' + durTxt(d) + ': mandane uno fino a 30 secondi. Puoi accorciarlo dal rullino e poi sceglierlo con «Dal rullino».');
    if (file.size > 400 * 1048576) throw new Error('Il video è troppo pesante (oltre 400 MB): prova con uno più corto.');
    var m = mimeDi(file, 'video'); return Object.assign(base, {blob:file, mime:m, durata:Math.round(d), nome:'video-' + k + (m === 'video/quicktime' ? '.mov' : m === 'video/webm' ? '.webm' : '.mp4'), th:''});
  });
  else pronto = Promise.resolve(Object.assign(base, {blob:file, mime:mimeDi(file, 'vocale'), nome:'vocale-' + k + (/mp4/.test(file.type) ? '.m4a' : '.webm'), th:''}));
  return pronto.then(function(it){ M.coda.push(it); codaSalva(it); if (S.view === 'scatta') render(); processa(); },
    function(e){ M.err = e && e.message || 'Non riesco ad aprire questo file.'; if (S.view === 'scatta') render(); });
}

function postM(body, lungo){
  var cred = body.prova ? (sposiCas() ? {segreto:sposiCas().segreto} : {anteprima:true}) : {c:body.c};
  var b = Object.assign({}, body, cred); delete b.prova;
  if (lungo) { // per i file mandati dentro la richiesta: niente limite dei 12 secondi
    var ac = window.AbortController ? new AbortController() : null, t = ac ? setTimeout(function(){ ac.abort(); }, 120000) : 0;
    return fetch(CONFIG.cassetta, {method:'POST', redirect:'follow', signal:ac ? ac.signal : undefined, headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(b)}).then(leggiTesto).then(function(o){ clearTimeout(t); return o; }, function(e){ clearTimeout(t); throw e; });
  }
  var diretto = fetchRip(CONFIG.cassetta, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(b)});
  if (body.prova || (b.a !== 'sessione' && b.a !== 'registra')) return diretto;
  return diretto.catch(function(){ return jsonp({a:'media', d:JSON.stringify(b)}); }); // canale di riserva, solo per gli invitati
}
function b64(blob){ return new Promise(function(ok, ko){ var r = new FileReader(); r.onload = function(){ ok(String(r.result).split(',')[1]); }; r.onerror = function(){ ko(r.error); }; r.readAsDataURL(blob); }); }
function carica(it){
  var base = {prova:it.prova, c:it.c, pid:it.pid || '', tipo:it.tipo, nome:it.nome, sfida:it.sfida, autore:it.autore, durata:it.durata};
  var riserva = function(){
    if (it.tipo === 'video' || it.blob.size > 9 * 1048576) throw new Error('rete');
    return b64(it.blob).then(function(d){ return postM(Object.assign({a:'caricab64', mime:it.mime, dati:d}, base), true); });
  };
  return postM(Object.assign({a:'sessione', mime:it.mime, size:it.blob.size, origin:location.origin}, base)).then(function(s){
    if (!s || !s.ok) { if (s && (s.motivo === 'chiuso' || s.motivo === 'codice' || s.motivo === 'segreto' || s.motivo === 'grande' || s.motivo === 'formato')) return s; return riserva(); }
    return fetch(s.url, {method:'PUT', body:it.blob}).then(function(r){ return r.ok ? r.json().catch(function(){ return {}; }) : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function(f){ return f && f.id ? f.id : ''; }, function(){ return ''; }) // se il browser non legge la risposta, il file può essere arrivato lo stesso
      .then(function(id){ return postM(Object.assign({a:'registra', id:id}, base)); })
      .then(function(r){ return r && r.ok ? r : (r && r.motivo === 'nonarrivato' ? riserva() : r); });

function vLanding(){
  var n = CONFIG.sposi, bg = CONFIG.copertina ? ' style="background-image:url(\'' + esc(CONFIG.copertina) + '\')"' : '';
  return '<div class="view">' +
    '<section class="cover"' + bg + '>' + (bg ? '' : '<span class="cvw"><img class="cvg" src="' + COPPIA + '" alt=""><img class="cvl" src="' + DECO.gazacc + '" alt=""></span>') + '<div class="cover-in"><p class="kick">Ci sposiamo</p>' +
    '<h1>' + esc(n[0]) + ' <span class="e">e</span> ' + esc(n[1]) + '</h1><p class="dt">' + esc(CONFIG.dataTesto) + '</p><span class="rl" aria-hidden="true"></span>' +
    '<div class="cd" id="cd" role="timer" aria-label="' + cdLabel() + '">' + cdHtml() + '</div>' +
    '<button class="dn" type="button" data-act="giu" aria-label="Scorri alla nostra storia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div></section>' +
    '<div class="land-body">' +
    (CONFIG.storia.length ? '<section class="story"><div class="lh"><h2>La nostra storia</h2><span class="gr" aria-hidden="true"></span></div>' +
      CONFIG.storia.map(function(x){ return '<article class="st"><div class="ph"' + (x.foto ? ' style="background-image:url(\'' + esc(x.foto) + '\')"' : '') + ' role="img" aria-label="' + esc(x.titolo) + '"></div><div class="tx"><p class="yr">' + esc(x.anno) + '</p><p class="tt">' + esc(x.titolo) + '</p><p class="ds">' + esc(x.testo) + '</p></div></article>'; }).join('') + '</section>' : '') +
    '<section class="prog"><div class="lh"><p class="ey">' + esc(CONFIG.dataTesto) + '</p><h2 style="font-size:38px">Il programma</h2><span class="gr" aria-hidden="true"></span></div><ol>' +
      CONFIG.programma.map(function(x){ return '<li><span class="dot" aria-hidden="true"><i></i></span><span class="ic" aria-hidden="true">' + (PIC[x.icona] ? '<img src="' + DECO[PIC[x.icona]] + '" alt="">' : svg(LIC[x.icona] || LIC.pin).replace('stroke-width="1.6"', 'stroke-width="1.5"')) + '</span><div class="w"><span class="o">' + esc(x.ora) + '</span><span class="c">' + esc(x.cosa) + '</span><span class="d">' + esc(x.dove) + '</span></div></li>'; }).join('') +
    '</ol><p class="nt">Indicazioni, parcheggi e mappe li trovi dentro l’app.</p></section>' +
    '<section class="close"><p style="font-size:17px;line-height:1.45">Conferma la presenza, scopri come arrivare e, il giorno delle nozze, scatta le foto per noi.</p>' +
    '<p class="tiny">Questa pagina la vedi solo la prima volta. Puoi riaprirla da Benvenuto.</p></section></div>' +
    '<div class="entra" id="entra"><button class="btn primary" type="button" data-act="entra">Entra</button></div></div>';
}
// La barra «Entra» si nasconde sulla copertina e compare appena si scorre
function entraBar(){ var b = document.getElementById('entra'), c = document.querySelector('.cover'); if (b && c) b.classList.toggle('on', window.scrollY > c.offsetHeight * 0.5); }
window.addEventListener('scroll', entraBar, {passive:true});
setInterval(function(){ var el = document.getElementById('cd'); if (el && !document.hidden) { el.innerHTML = cdHtml(); el.setAttribute('aria-label', cdLabel()); } }, 30000);
function render(){
  var app = $('#app');
  var key = (S.landing ? 'land:' : '') + (S.inv ? 'in:' : 'out:') + S.view + (S.loading && !S.inv ? ':l' : '');
  var enter = key !== lastKey; lastKey = key;
  setTimeout(function(){ var v = app.firstElementChild; if (v && enter) { v.classList.add('enter'); } }, 0);
  if (S.landing) { var ab1 = $('#antep'); if (ab1) ab1.remove(); app.className = 'land'; $('#bar').hidden = true; app.innerHTML = vLanding(); setTimeout(entraBar, 0); return; }
  if (S.loading && !S.inv && codice) { app.className = 'nobar'; $('#bar').hidden = true; app.innerHTML = '<div class="view"><section class="card empty tag"><img class="sprig" src="' + RAMETTO + '" alt="" style="width:110px"><b>Un attimo…</b></section></div>'; return; }
  if (!S.inv) { var ab0 = $('#antep'); if (ab0) ab0.remove(); app.className = 'nobar'; $('#bar').hidden = true; app.innerHTML = vWho(); return; }
  app.className = ''; $('#bar').hidden = false; renderTabs();
  var ab = $('#antep'); if (S.inv.anteprima && !ab) { ab = document.createElement('button'); ab.id = 'antep'; ab.type = 'button'; ab.className = 'demo'; ab.dataset.act = 'esci'; ab.textContent = 'Anteprima sposi · Esci'; document.body.appendChild(ab); }
  if (!S.inv.anteprima && ab) ab.remove();
  app.innerHTML = ({home:vHome, rsvp:vRsvp, arrivare:vArrivare,
    scatta:vScatta, galleria:vGalleria})[S.view]();
}

// L'invito si salva sul telefono: chi è già entrato lo ritrova anche senza rete, e intanto si aggiorna in silenzio.
function entra(inv, nuovaBozza){ S.err = ''; S.retry = null; if (!inv.anteprima) store.set('anteprima-sposi', null); S.inv = inv; if (nuovaBozza || !S.draft) S.draft = mkDraft(inv); codice = inv.c; store.set('invito-codice', codice); store.set('invito-copia', JSON.stringify(inv)); segnaCodice(); }
function esci(){ S.err = ''; S.retry = null; store.set('anteprima-sposi', null); store.set('invito-codice', null); store.set('invito-copia', null); codice = ''; S.inv = null; S.draft = null; S.view = 'home'; segnaCodice(); }
// Il codice resta nell'indirizzo: l'icona sulla schermata Home riapre lo stesso invito.
function anteprimaInv(){ return {c:'', anteprima:true, saluto:CONFIG.sposi.join(' e '), messaggio:'Questa è l’anteprima degli sposi: vedete l’app come un invitato. Le risposte qui non vengono mandate.', scadenza:'', piuUno:false, risposta:null,
  persone:CONFIG.sposi.map(function(x, i){ return {id:'sp' + i, nome:x, cognome:'', tipo:'adulto'}; })}; }
function segnaCodice(){ try { var u = new URL(location.href); if (codice) u.searchParams.set('i', codice); else u.searchParams.delete('i'); if (u.href !== location.href) history.replaceState(null, '', u.href); } catch (e) {} }
// Un errore di collegamento rimasto a schermo è vecchio: quando si torna sulla pagina riprovo subito invece di mostrarlo.
function riprovaVecchio(){ if (S.inv || !S.err || !S.retry || S.loading || S.sending) return false; var f = S.retry; S.err = ''; S.retry = null; f(); return true; }
document.addEventListener('visibilitychange', function(){ if (!document.hidden) riprovaVecchio(); });
function load(c, silenzioso){
  if (!silenzioso) { S.loading = true; S.err = ''; render(); }
  // «c» è un nome riservato da Google negli indirizzi degli script: il codice viaggia come «codice».
  return api({a:'invito', codice:c}).then(function(r){
    S.loading = false;
    if (r && r.ok) { entra(r.invito, !silenzioso || S.view !== 'rsvp'); if (!silenzioso) S.view = vistaIniziale(r.invito); }
    else if (r && r.motivo === 'codice') { esci(); S.err = 'Questo link d’invito non funziona più. Scrivi nome e cognome per entrare.'; }
    render();
  }).catch(function(){ S.loading = false; if (silenzioso) return; S.err = errTxt('Non riesco a collegarmi. Controlla la connessione e riprova.', function(){ load(c); }); render(); });
}

document.addEventListener('submit', function(e){
  if (e.target.id !== 'whoF') return; e.preventDefault();
  var n = $('#wn').value.trim(), c = $('#wc').value.trim();
  S.sposi = false;
  if (!n) { S.err = 'Scrivi almeno il nome.'; render(); return; }
  // Gli sposi entrano in anteprima: vedono tutto come un invitato, ma la risposta non viene mandata a nessuno.
  if (CONFIG.firmaSposi.indexOf((n + ' ' + c).toLowerCase().replace(/\s+/g, ' ').trim()) >= 0) { S.err = ''; entra(anteprimaInv(), true); store.set('invito-copia', null); store.set('anteprima-sposi', '1'); S.view = 'home'; render(); window.scrollTo(0, 0); return; }
  S.loading = true; S.err = ''; render();
  api({a:'cerca', nome:n, cognome:c}).then(function(r){
    S.loading = false;
    if (r && r.ok) { entra(r.invito, true); S.view = vistaIniziale(r.invito); window.scrollTo(0, 0); }
    else S.err = r && r.motivo === 'ambiguo' ? (c ? 'Ci sono più invitati con questo nome. Usa il link che ti abbiamo mandato, oppure scrivici.' : 'Ci sono più invitati che si chiamano così: aggiungi il cognome.') : 'Non troviamo questo nome. Controlla come è scritto sull’invito o usa il link che ti abbiamo mandato. Abbiamo avvisato gli sposi.';
    render();
    var el = $('#wn'); if (el && !S.inv) { el.value = n; $('#wc').value = c; }
  }).catch(function(){ S.loading = false; S.err = errTxt('Non riesco a collegarmi. Controlla la connessione e riprova.', function(){ var f = $('#whoF'); $('#wn').value = n; $('#wc').value = c; if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', {cancelable:true})); }); render(); var el = $('#wn'); if (el) { el.value = n; $('#wc').value = c; } });
});

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go],[data-act]'); if (!t) return;
  if (t.dataset.go) { S.view = t.dataset.go; S.err = ''; S.sent = false; render(); window.scrollTo(0, 0); return; }
  var a = t.dataset.act, dr = S.draft;
  if (mediaClick(a, t)) return;
  if (a === 'pres') { dr.presenza = t.dataset.v; S.sent = false; render(); }
  else if (a === 'viene') { var x = dr.persone[+t.dataset.i]; x.viene = !x.viene; if (!x.viene && S.open === S.inv.persone[+t.dataset.i].id) S.open = null; S.sent = false; render(); }
  else if (a === 'open') { S.open = S.open === t.dataset.id ? null : t.dataset.id; render(); var b = document.querySelector('[data-act="open"][data-id="' + t.dataset.id + '"]'); if (b) b.focus(); }
  else if (a === 'more') { S.more[t.dataset.id] = true; render(); }
  else if (a === 'all') { var y = dr.persone[+t.dataset.i], v = t.dataset.v, k = y.allergie.indexOf(v); if (k >= 0) y.allergie.splice(k, 1); else y.allergie.push(v); S.sent = false; render(); var c2 = document.querySelector('[data-act="all"][data-i="' + t.dataset.i + '"][data-v="' + v + '"]'); if (c2) c2.focus(); }
  else if (a === 'entra') { store.set('landing-vista', '1'); S.landing = false; S.view = 'home'; if (!riprovaVecchio()) render(); window.scrollTo(0, 0); }
  else if (a === 'giu') { var lb = document.querySelector('.land-body'); if (lb) lb.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
  else if (a === 'landing') { S.landing = true; render(); window.scrollTo(0, 0); }
  else if (a === 'esci') { esci(); render(); }
  else if (a === 'riprova') { var f = S.retry; S.err = ''; S.retry = null; if (f) f(); else render(); }
  else if (a === 'send') {
    if (S.sending) return;
    if (dr.presenza === 'si' && !dr.persone.some(function(p){ return p.viene; })) { S.err = 'Hai risposto sì ma nessuno risulta presente: segna chi viene, oppure scegli «No».'; render(); return; }
    if (S.inv.anteprima) { S.inv.risposta = {presenza:dr.presenza, persone:dr.persone, messaggio:dr.messaggio, piuUno:dr.piuUno, quando:new Date().toISOString()}; S.sent = true; S.err = ''; render(); return; }
    S.sending = true; S.err = ''; render();
    var body = {a:'rispondi', c:S.inv.c, risposta:{presenza:dr.presenza, messaggio:dr.presenza === 'no' ? dr.messaggio : '', piuUno:dr.piuUno,
      persone: dr.presenza === 'si' ? dr.persone : dr.persone.map(function(p){ return {id:p.id, viene:false, allergie:[], note:''}; })}};
    post(body).then(function(r){
      S.sending = false;
      if (r && r.ok) { S.inv.risposta = r.risposta; S.sent = true; store.set('invito-copia', JSON.stringify(S.inv)); }
      else S.err = r && r.motivo === 'scaduto' ? 'Il tempo per rispondere è finito. Scrivici direttamente e ci pensiamo noi.' : errTxt(r && r.motivo === 'occupato' ? 'Tante risposte insieme: la tua non è ancora partita.' : 'La risposta non è partita.', function(){ var bt = document.querySelector('[data-act="send"]'); if (bt) bt.click(); });
      render(); window.scrollTo(0, 0);
    }).catch(function(){ S.sending = false; S.err = errTxt('Non riesco a collegarmi: la risposta non è partita. Controlla la connessione e riprova.', function(){ var bt = document.querySelector('[data-act="send"]'); if (bt) bt.click(); }); render(); });
  }
});
document.addEventListener('input', function(e){
  var t = e.target, a = t.dataset && t.dataset.act, dr = S.draft; if (!a || !dr) return;
  if (a === 'note') dr.persone[+t.dataset.i].note = t.value;
  else if (a === 'msg') dr.messaggio = t.value;
  else if (a === 'piu') dr.piuUno = t.value;
});

if (DEMO) { var b = document.createElement('div'); b.className = 'demo'; b.textContent = 'Prova · dati finti'; document.body.appendChild(b); }
// Contenuti della home dalla cassetta: prima la copia sul telefono, poi la versione aggiornata in silenzio.
function applicaContenuti(c){
  if (!c || typeof c !== 'object') return;
  // Le foto della home stanno nel Drive degli sposi («drive:ID»); le vecchie («foto/…») restano sul sito.
  var fotoUrl = function(x){ x = String(x || ''); return /^drive:[\w-]+$/.test(x) ? 'https://lh3.googleusercontent.com/d/' + x.slice(6) + '=w1600' : x; };
  if (typeof c.aperte === 'boolean') store.set('prove-aperte', c.aperte ? '1' : null);
  if (typeof c.copertina === 'string') CONFIG.copertina = fotoUrl(c.copertina);
  if (Array.isArray(c.storia)) CONFIG.storia = c.storia.filter(function(x){ return x && (x.titolo || x.testo || x.foto); }).map(function(x){ return Object.assign({}, x, {foto: fotoUrl(x.foto)}); });
  if (Array.isArray(c.sfide) && c.sfide.length) CONFIG.sfide = c.sfide.filter(Boolean);
  ['programma', 'luoghi'].forEach(function(k){ if (Array.isArray(c[k]) && c[k].length) CONFIG[k] = c[k].filter(function(x){ return x && (x.cosa || x.nome || x.ora); }); });
}
try { applicaContenuti(JSON.parse(store.get('contenuti-copia') || 'null')); } catch (e) {}
if (!DEMO) (useJP ? jsonp({a:'contenuti'}) : fetchRip(CONFIG.cassetta + '?a=contenuti').catch(function(){ return jsonp({a:'contenuti'}); }))
  .then(function(r){
    if (r && r.ok && typeof r.aperte === 'boolean' && r.aperte !== proveAperte()) {
      store.set('prove-aperte', r.aperte ? '1' : null);
      if (S.inv && (S.view === 'scatta' || S.view === 'galleria')) render();
    }
    if (!r || !r.ok || !r.contenuti) return;
    var nuovo = JSON.stringify(r.contenuti); if (nuovo === store.get('contenuti-copia')) return;
    store.set('contenuti-copia', nuovo); applicaContenuti(r.contenuti);
    // Ridisegno solo le schermate che li mostrano, mai mentre qualcuno scrive il nome o la risposta.
    if (S.landing || (S.inv && (S.view === 'home' || S.view === 'arrivare'))) render();
  }).catch(function(){});
(function(){ var copia = null; try { copia = JSON.parse(store.get('invito-copia') || 'null'); } catch (e) {}
  // Gli sposi in anteprima restano dentro anche alla riapertura, come un invitato (finché non premono Esci).
  if (!q.has('i') && store.get('anteprima-sposi') === '1') { S.loading = false; entra(anteprimaInv(), true); store.set('invito-copia', null); S.view = 'home'; render(); }
  else if (codice && copia && copia.c === codice) { S.loading = false; entra(copia, true); S.view = vistaIniziale(copia); render(); load(codice, true); }
  else if (codice) load(codice); else { S.loading = false; render(); } })();
codaCarica().then(function(){ if (M.coda.length) processa(); });
if ('serviceWorker' in navigator && !DEMO && location.protocol === 'https:') navigator.serviceWorker.register('sw-invitati.js').catch(function(){});
})();
</script>
