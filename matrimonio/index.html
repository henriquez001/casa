<style>
/* Stile C «Ulivo del design» sui token del tool sposi. */
:root{
  --bg:#F2ECDF; --surface:#FFFCF5; --fg:#2E3528; --muted:#696656; --line:#E6DFCC;
  --accent:#56654A; --accent-fg:#FFFCF5; --accent-soft:#E8EADC; --gold:#B8901F; --copper:#8A6A14; --bad:#A0472F;
  --bar:rgba(255,252,245,.84);
  --r:16px;
  --font-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-sc:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --font-script:"Pinyon Script","Snell Roundhand",cursive;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 104px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
main.nobar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
.view{display:flex;flex-direction:column;gap:12px}
.view.enter{animation:in .18s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
h1.t{font-family:var(--font-display);font-size:38px;line-height:1.05;font-weight:600;margin:0;text-wrap:balance}
.sub{margin:0;font-size:15px;color:var(--muted)}
.eyebrow{font-family:var(--font-sc);font-size:14px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.hero{padding:14px 18px 20px;display:grid;gap:10px;text-align:center}
.olive{display:grid;justify-items:center;gap:4px;padding-top:4px}
.olive img{width:270px;max-width:100%;height:auto}
.names{margin:0;font-family:var(--font-script);font-weight:400;font-size:40px;line-height:1.05;display:flex;flex-direction:column;align-items:center;color:var(--fg)}
.names .amp{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:22px;color:var(--muted);margin:-2px 0 -4px}
.names.row{flex-direction:row;gap:8px;align-items:baseline;font-size:38px}
.names.row .amp{margin:0}
.goldrule{width:44px;height:0;border-top:1px solid var(--gold);opacity:.8;justify-self:center}
.days{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:24px;line-height:1;color:var(--copper);font-variant-numeric:lining-nums tabular-nums}
.greet{padding:16px 18px;display:grid;gap:6px}
.greet .hi{margin:0;font-family:var(--font-script);font-weight:400;font-size:32px;line-height:1.1;color:var(--accent)}
.greet p{margin:0}
.btn{font:inherit;font-size:17px;font-weight:600;min-height:50px;padding:10px 16px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer;text-decoration:none;transition:transform .1s ease-out}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.plain{background:none;min-height:44px;font-size:16px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}
.sect{padding:16px;display:grid;gap:10px}
.sect .h{margin:0;font-size:17px;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:10px;padding:2px}
.seg button{font:inherit;font-size:15px;font-weight:600;min-height:44px;border:0;border-radius:8px;background:none;color:var(--fg);cursor:pointer;transition:background-color .2s ease-out, box-shadow .2s ease-out}
.seg button[aria-checked=true]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.person{display:grid;grid-template-columns:44px 1fr;align-items:center;column-gap:4px;row-gap:8px;border-top:1px solid var(--line);padding-top:8px}
.chk{width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chk span{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;color:var(--accent-fg);font-size:15px;font-weight:700;transition:background-color .15s ease-out,border-color .15s ease-out}
.chk[aria-checked=true] span{background:var(--accent);border-color:var(--accent)}
.pn{margin:0;font-size:16px;font-weight:600}
.pr{margin:0;font-size:13px;color:var(--muted)}
.off .pn{color:var(--muted)}
.allg{grid-column:2;font:inherit;min-height:44px;padding:4px 12px;border:0;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;color:var(--fg)}
.allg .l{display:grid;font-size:12px;color:var(--muted)}
.allg .l b{font-size:14px;font-weight:600;color:var(--fg)}
.allg .o{font-size:14px;font-weight:600;color:var(--accent)}
.panel{grid-column:2;display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.panel.open{grid-template-rows:1fr}
.panel>div{overflow:hidden;display:grid;gap:10px}
.panel.open>div{padding-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;font-weight:600;min-height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.linkb{font:inherit;font-size:14px;font-weight:600;color:var(--accent);background:none;border:0;padding:0;min-height:44px;text-align:left;cursor:pointer}
textarea,input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:none}
input::placeholder,textarea::placeholder{color:#8C897A}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.tot{margin:2px 0 0;font-size:14px;color:var(--muted)}
.tot b{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:19px;color:var(--fg)}
.tiny{margin:0;font-size:12px;line-height:1.45;color:var(--muted)}
.who{padding:16px 18px 22px;display:grid;gap:6px;text-align:center;justify-items:center}
.sprig{width:150px;height:auto}
.sprig.sm{width:96px;margin-bottom:-4px}
.msg{padding:14px 16px;border-radius:12px;font-size:15px}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.msg.err{background:#F5E1D8;color:#7E3420}
.place{padding:16px 18px;display:grid;gap:4px}
.place .when{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:22px;color:var(--copper)}
.place .what{margin:0;font-size:17px;font-weight:600}
.empty{padding:22px 18px;text-align:center;display:grid;gap:6px;justify-items:center}
.empty b{font-size:17px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{font:inherit;border:0;background:none;color:var(--muted);display:grid;justify-items:center;align-content:center;gap:2px;padding:7px 2px 6px;min-height:50px;cursor:pointer;font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-current=page]{color:var(--accent)}
.pillw{width:40px;height:30px;border-radius:15px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.pillw svg{width:21px;height:21px}
.demo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:max(10px,env(safe-area-inset-right,0px));z-index:30;font-size:12px;font-weight:600;background:var(--copper);color:#FFFCF5;padding:4px 10px;border-radius:999px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.view.enter{animation:none}.btn,.seg button,.chk span{transition:none}.btn:active{transform:none}.panel{transition:none}}
@media (prefers-reduced-transparency: reduce){.tabbar{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast: more){:root{--line:#B9AF98;--muted:#4F4D40}}
</style>

/* ---------- viste ---------- */
var I = {
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  rsvp:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  scatta:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  arrivare:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  galleria:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>'
};
function svg(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'; }
var TABS = [['home','Benvenuto'],['rsvp','Partecipa'],['scatta','Scatta'],['arrivare','Arrivare'],['galleria','Galleria']];
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(function(t){
    var ic = t[0] === 'scatta' ? '<span class="pillw">' + svg(I.scatta) + '</span>' : svg(I[t[0]]);
    return '<button class="tab" type="button" data-go="' + t[0] + '"' + (S.view === t[0] ? ' aria-current="page"' : '') + '>' + ic + t[1] + '</button>';
  }).join('');
}

function vWho(){
  return '<div class="view">' +
    '<section class="card who"><img class="sprig" src="' + RAMETTO + '" alt="">' + names(true) +
    '<p style="margin:2px 0 0;font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.15">Benvenuto al nostro matrimonio</p>' +
    '<p class="sub">Qui trovi le informazioni, puoi confermare la presenza e il giorno delle nozze scattare le foto per noi.</p></section>' +
    '<form class="card sect" id="whoF" novalidate><p class="h">Come ti chiami?</p>' +
    '<label class="f" for="wn">Nome<input id="wn" name="nome" autocomplete="given-name" autocapitalize="words" placeholder="Es. Carla" required></label>' +
    '<label class="f" for="wc">Cognome<input id="wc" name="cognome" autocomplete="family-name" autocapitalize="words" placeholder="Es. Rossi"></label>' +
    '<p class="tiny">Se il tuo nome o il soprannome con cui ti conosciamo è unico, basta quello. Se hai il link dell’invito, entri senza scrivere nulla.</p>' +
    (S.err ? '<div class="msg err" role="alert">' + S.err + '</div>' : '') +
    (S.sposi ? (DEMO ? '<div class="msg ok">Ciao! Questa è solo l\'anteprima degli invitati, qui lo spazio sposi non c\'è. Sul sito vero, dai telefoni e dal PC che hanno la vostra chiave, si apre direttamente il vostro tool, senza scrivere il nome.</div>' : '<div class="msg ok">Ciao! Il vostro spazio da sposi si apre solo dai telefoni che hanno la vostra chiave. <a href="sposi.html" style="color:inherit;font-weight:700">Apri lo spazio sposi</a></div>') : '') +
    '<button class="btn primary" type="submit"' + (S.loading ? ' disabled' : '') + '>' + (S.loading ? 'Un attimo…' : 'Entra') + '</button></form>' +
    '<p class="tiny" style="text-align:center">Il nome resta su questo telefono: la prossima volta entri direttamente.</p></div>';
}

function vHome(){
  var inv = S.inv, d = daysLeft();
  var dTxt = d > 1 ? 'Mancano ' + d + ' giorni' : d === 1 ? 'Manca un giorno' : d === 0 ? 'È oggi!' : 'Grazie di esserci stati';
  var r = inv.risposta;
  var stato = r ? (r.presenza === 'si' ? '<div class="msg ok">Hai confermato: ci sarete. Puoi cambiare la risposta da Partecipa.</div>' : '<div class="msg ok">Ci hai detto che non potrai esserci. Se cambi idea, rispondi di nuovo da Partecipa.</div>') : '';
  return '<div class="view">' +
    '<section class="card hero"><div class="olive"><img src="' + COPPIA + '" alt="">' + names(false) + '</div>' +
    '<p class="sub">' + esc(CONFIG.dataTesto) + '</p><div class="goldrule" aria-hidden="true"></div><div class="days">' + dTxt + '</div></section>' +
    '<section class="card greet"><p class="hi">' + esc((inv.saluto || '').trim() || 'Ciao, ' + nomiInv(inv)) + '</p>' +
    (inv.messaggio ? '<p>' + esc(inv.messaggio) + '</p>' : '<p>Non vediamo l’ora di festeggiare insieme.</p>') +
    '<p class="sub">' + esc(CONFIG.sposi.join(' e ')) + '</p></section>' + stato +
    '<div class="btns"><button class="btn primary" type="button" data-go="rsvp">' + (r ? 'Rivedi la tua risposta' : 'Conferma la tua presenza') + '</button>' +
    '<button class="btn" type="button" data-go="arrivare">Come arrivare</button></div>' +
    '<button class="btn plain" type="button" data-act="esci">' + ((inv.persone || []).length > 1 ? 'Non siete ' : 'Non sei ') + esc(nomiInv(inv)) + '?</button></div>';
}
function nomiInv(inv){
  var n = (inv.persone || []).map(function (p) { return p.nome; }).filter(Boolean);
  if (n.length < 2) return n[0] || '';
  var last = n.pop(); return n.join(', ') + (/^[eE]/.test(last) ? ' ed ' : ' e ') + last;
}

function summary(dr){
  var n = {adulto:0, bambino:0, neonato:0};
  S.inv.persone.forEach(function(p, i){ if (dr.persone[i].viene) n[p.tipo]++; });
  var out = [];
  if (n.adulto) out.push(n.adulto + (n.adulto === 1 ? ' adulto' : ' adulti'));
  if (n.bambino) out.push(n.bambino + (n.bambino === 1 ? ' bambino 3–10 anni' : ' bambini 3–10 anni'));
  if (n.neonato) out.push(n.neonato + (n.neonato === 1 ? ' bambino sotto i 3 anni' : ' bambini sotto i 3 anni'));
  return out.join(' · ') || 'nessuno';
}
function vRsvp(){
  var inv = S.inv, dr = S.draft;
  var sc = inv.scadenza ? 'Rispondi entro il ' + fmtDate(inv.scadenza) + '. Puoi cambiare idea fino ad allora.' : 'Puoi cambiare idea quando vuoi.';
  var h = '<div class="view"><header style="display:grid;gap:4px;padding-top:24px"><img class="sprig sm" src="' + RAMETTO + '" alt=""><h1 class="t">Partecipa</h1><p class="sub">' + sc + '</p></header>';
  if (S.sent) h += '<div class="msg ok" role="status">Risposta inviata, grazie! ' + (dr.presenza === 'si' ? 'Vi aspettiamo.' : 'Ci mancherete.') + '</div>';
  h += '<section class="card sect"><p class="h" id="cs">Ci sarete?</p><div class="seg" role="radiogroup" aria-labelledby="cs">' +
    '<button type="button" role="radio" data-act="pres" data-v="si" aria-checked="' + (dr.presenza === 'si') + '">Sì, ci saremo</button>' +
    '<button type="button" role="radio" data-act="pres" data-v="no" aria-checked="' + (dr.presenza === 'no') + '">Purtroppo no</button></div></section>';
  if (dr.presenza === 'si') {
    h += '<section class="card sect"><div style="display:grid;gap:2px"><p class="h">Chi viene?</p><p class="tiny" style="font-size:13px">Togli la spunta a chi non può esserci e indica le allergie persona per persona.</p></div>';
    inv.persone.forEach(function(p, i){
      var x = dr.persone[i], open = S.open === p.id, more = S.more[p.id];
      var lab = x.allergie.length ? x.allergie.join(', ') : 'nessuna';
      h += '<div class="person' + (x.viene ? '' : ' off') + '">' +
        '<button class="chk" type="button" role="checkbox" aria-checked="' + x.viene + '" data-act="viene" data-i="' + i + '" aria-label="' + esc(p.nome + ' ' + p.cognome) + ' viene"><span>' + (x.viene ? '✓' : '') + '</span></button>' +
        '<div><p class="pn">' + esc(p.nome + ' ' + p.cognome) + '</p><p class="pr">' + (x.viene ? TIPO[p.tipo] : 'Non viene') + '</p></div>';
      if (x.viene) {
        h += '<button class="allg" type="button" data-act="open" data-id="' + p.id + '" aria-expanded="' + open + '" aria-controls="pa-' + p.id + '"><span class="l">Allergie e intolleranze<b>' + esc(lab) + '</b></span><span class="o">' + (open ? 'Chiudi' : 'Apri') + '</span></button>' +
          '<div class="panel' + (open ? ' open' : '') + '" id="pa-' + p.id + '"><div>' +
          '<div class="chips" role="group" aria-label="Allergie di ' + esc(p.nome) + '">' + ALL_MAIN.concat(more ? ALL_MORE : []).map(function(a){
            return '<button class="chip" type="button" data-act="all" data-i="' + i + '" data-v="' + esc(a) + '" aria-pressed="' + (x.allergie.indexOf(a) >= 0) + '"' + (open ? '' : ' tabindex="-1"') + '>' + esc(a) + '</button>'; }).join('') + '</div>' +
          (more ? '' : '<button class="linkb" type="button" data-act="more" data-id="' + p.id + '"' + (open ? '' : ' tabindex="-1"') + '>+ Altri ' + ALL_MORE.length + ' allergeni</button>') +
          '<label class="sr" for="nt-' + p.id + '">Note per la cucina per ' + esc(p.nome) + '</label><textarea id="nt-' + p.id + '" rows="2" data-act="note" data-i="' + i + '" placeholder="Note per la cucina, es. anche tracce"' + (open ? '' : ' tabindex="-1"') + '>' + esc(x.note) + '</textarea>' +
          '</div></div>';
      }
      h += '</div>';
    });
    if (inv.piuUno) h += '<label class="f" for="pu">Il tuo accompagnatore (facoltativo)<input id="pu" data-act="piu" value="' + esc(dr.piuUno) + '" placeholder="Nome e cognome"></label>';
    h += '<p class="tiny" style="font-size:13px">Manca qualcuno o un nome è sbagliato? Scrivici e lo sistemiamo noi.</p>' +
      '<p class="tot">In tutto: <b>' + summary(dr) + '</b></p></section>';
  } else if (dr.presenza === 'no') {
    h += '<section class="card sect"><p class="h">Ci dispiace, ci mancherete!</p><label class="f" for="msgNo">Se vuoi, lasciaci un messaggio. Non è obbligatorio.<textarea id="msgNo" rows="4" data-act="msg" placeholder="Scrivi qui…">' + esc(dr.messaggio) + '</textarea></label></section>';
  }
  if (S.err) h += '<div class="msg err" role="alert">' + S.err + '</div>';
  h += '<button class="btn primary" type="button" data-act="send"' + (!dr.presenza || S.sending ? ' disabled' : '') + '>' + (S.sending ? 'Invio…' : (inv.risposta ? 'Aggiorna la risposta' : 'Invia la risposta')) + '</button>' +
    '<p class="tiny" style="padding:0 4px">Le informazioni sulle allergie le vedono solo gli sposi e servono al catering. Le cancelliamo dopo il matrimonio.</p></div>';
  return h;
}

function maps(l){
  if (!l.cerca) return '';
  var s = encodeURIComponent(l.cerca);
  return '<div class="btns two" style="margin-top:8px"><a class="btn" href="https://maps.apple.com/?q=' + s + '" target="_blank" rel="noopener">Mappe Apple</a><a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=' + s + '" target="_blank" rel="noopener">Google Maps</a></div>';
}
function vArrivare(){
  return '<div class="view"><header style="padding-top:24px"><h1 class="t">Come arrivare</h1><p class="sub">' + esc(CONFIG.dataTesto) + '</p></header>' +
    CONFIG.luoghi.map(function(l){ return '<section class="card place"><span class="eyebrow">' + esc(l.titolo) + '</span><span class="when">' + esc(l.ora) + '</span><p class="what">' + esc(l.nome) + '</p>' +
      (l.indirizzo ? '<p class="sub">' + esc(l.indirizzo) + '</p>' : '') + (l.note ? '<p class="sub">' + esc(l.note) + '</p>' : '') + maps(l) + '</section>'; }).join('') + '</div>';
}
function vSoon(t, txt){ return '<div class="view"><header style="padding-top:24px"><h1 class="t">' + t + '</h1></header><section class="card empty"><img class="sprig" src="' + RAMETTO + '" alt="" style="width:110px"><b>Dal ' + esc(CONFIG.dataTesto.replace(/^\w+ /, '')) + '</b><span class="sub">' + txt + '</span></section></div>'; }

function render(){
  var app = $('#app');
  var key = (S.inv ? 'in:' : 'out:') + S.view + (S.loading && !S.inv ? ':l' : '');
  var enter = key !== lastKey; lastKey = key;
  setTimeout(function(){ var v = app.firstElementChild; if (v && enter) { v.classList.add('enter'); } }, 0);
  if (S.loading && !S.inv && codice) { app.className = 'nobar'; $('#bar').hidden = true; app.innerHTML = '<div class="view"><section class="card empty"><img class="sprig" src="' + RAMETTO + '" alt="" style="width:110px"><b>Un attimo…</b></section></div>'; return; }
  if (!S.inv) { app.className = 'nobar'; $('#bar').hidden = true; app.innerHTML = vWho(); return; }
  app.className = ''; $('#bar').hidden = false; renderTabs();
  app.innerHTML = ({home:vHome, rsvp:vRsvp, arrivare:vArrivare,
    scatta:function(){ return vSoon('Scatta', 'Il giorno delle nozze da qui scatti foto e video per noi, e partecipi alle sfide fotografiche.'); },
    galleria:function(){ return vSoon('Galleria', 'Dopo la festa qui trovi tutte le foto scattate dagli invitati.'); }})[S.view]();
}

function load(c){
  S.loading = true; S.err = ''; render();
  return api({a:'invito', c:c}).then(function(r){
    S.loading = false;
    if (r && r.ok) { S.inv = r.invito; S.draft = mkDraft(r.invito); codice = r.invito.c; store.set('invito-codice', codice); }
    else { store.set('invito-codice', null); codice = ''; S.err = 'Questo link d’invito non funziona più. Scrivi nome e cognome per entrare.'; }
    render();
  }).catch(function(){ S.loading = false; S.err = 'Non riesco a collegarmi. Controlla la connessione e riprova.'; render(); });
}

document.addEventListener('submit', function(e){
  if (e.target.id !== 'whoF') return; e.preventDefault();
  var n = $('#wn').value.trim(), c = $('#wc').value.trim();
  S.sposi = false;
  if (!n) { S.err = 'Scrivi almeno il nome.'; render(); return; }
  if (CONFIG.firmaSposi.indexOf((n + ' ' + c).toLowerCase().replace(/\s+/g, ' ')) >= 0) { S.sposi = true; S.err = ''; render(); return; }
  S.loading = true; S.err = ''; render();
  api({a:'cerca', nome:n, cognome:c}).then(function(r){
    S.loading = false;
    if (r && r.ok) { S.inv = r.invito; S.draft = mkDraft(r.invito); codice = r.invito.c; store.set('invito-codice', codice); S.view = 'home'; window.scrollTo(0, 0); }
    else S.err = r && r.motivo === 'ambiguo' ? (c ? 'Ci sono più invitati con questo nome. Usa il link che ti abbiamo mandato, oppure scrivici.' : 'Ci sono più invitati che si chiamano così: aggiungi il cognome.') : 'Non troviamo questo nome. Controlla come è scritto sull’invito o usa il link che ti abbiamo mandato. Abbiamo avvisato gli sposi.';
    render();
    var el = $('#wn'); if (el && !S.inv) { el.value = n; $('#wc').value = c; }
  }).catch(function(){ S.loading = false; S.err = 'Non riesco a collegarmi. Controlla la connessione e riprova.'; render(); });
});

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go],[data-act]'); if (!t) return;
  if (t.dataset.go) { S.view = t.dataset.go; S.err = ''; S.sent = false; render(); window.scrollTo(0, 0); return; }
  var a = t.dataset.act, dr = S.draft;
  if (a === 'pres') { dr.presenza = t.dataset.v; S.sent = false; render(); }
  else if (a === 'viene') { var x = dr.persone[+t.dataset.i]; x.viene = !x.viene; if (!x.viene && S.open === S.inv.persone[+t.dataset.i].id) S.open = null; S.sent = false; render(); }
  else if (a === 'open') { S.open = S.open === t.dataset.id ? null : t.dataset.id; render(); var b = document.querySelector('[data-act="open"][data-id="' + t.dataset.id + '"]'); if (b) b.focus(); }
  else if (a === 'more') { S.more[t.dataset.id] = true; render(); }
  else if (a === 'all') { var y = dr.persone[+t.dataset.i], v = t.dataset.v, k = y.allergie.indexOf(v); if (k >= 0) y.allergie.splice(k, 1); else y.allergie.push(v); S.sent = false; render(); var c2 = document.querySelector('[data-act="all"][data-i="' + t.dataset.i + '"][data-v="' + v + '"]'); if (c2) c2.focus(); }
  else if (a === 'esci') { store.set('invito-codice', null); codice = ''; S.inv = null; S.view = 'home'; render(); }
  else if (a === 'send') {
    S.sending = true; S.err = ''; render();
    var body = {a:'rispondi', c:S.inv.c, risposta:{presenza:dr.presenza, messaggio:dr.presenza === 'no' ? dr.messaggio : '', piuUno:dr.piuUno,
      persone: dr.presenza === 'si' ? dr.persone : dr.persone.map(function(p){ return {id:p.id, viene:false, allergie:[], note:''}; })}};
    post(body).then(function(r){
      S.sending = false;
      if (r && r.ok) { S.inv.risposta = r.risposta; S.sent = true; }
      else S.err = r && r.motivo === 'scaduto' ? 'Il tempo per rispondere è finito. Scrivici direttamente e ci pensiamo noi.' : 'La risposta non è partita. Riprova tra poco.';
      render(); window.scrollTo(0, 0);
    }).catch(function(){ S.sending = false; S.err = 'Non riesco a collegarmi: la risposta non è partita. Controlla la connessione e riprova.'; render(); });
  }
});
document.addEventListener('input', function(e){
  var t = e.target, a = t.dataset && t.dataset.act, dr = S.draft; if (!a || !dr) return;
  if (a === 'note') dr.persone[+t.dataset.i].note = t.value;
  else if (a === 'msg') dr.messaggio = t.value;
  else if (a === 'piu') dr.piuUno = t.value;
});

if (DEMO) { var b = document.createElement('div'); b.className = 'demo'; b.textContent = 'Prova · dati finti'; document.body.appendChild(b); }
if (codice) load(codice); else { S.loading = false; render(); }
})();
</script>
</body>
</html>
