/* Layout: una colonna da app (max 760px), titolo grande per scheda, tab bar fissa in basso su materiale traslucido. Stile «Ghirlanda C1» dalla moodboard degli inviti: carta avorio, verde oliva, filetti in oro antico, ghirlanda d'ulivo ad acquerello che abbraccia i nomi in Pinyon Script nella card principale, numeri in Cormorant Garamond corsivo. Palette volutamente solo chiara, come richiesto. */
:root{
  color-scheme:light;
  --bg:#F2ECDF; --surface:#FFFCF5; --fg:#2E3528; --muted:#696656; --line:#E6DFCC;
  --accent:#56654A; --accent-fg:#FFFCF5; --accent-soft:#E8EADC;
  --copper:#8A6A14; --ochre:#B8901F; --olive:#7D8C63; --gold:#B8901F;
  --c-spese:#A0472F; --c-entrate:#56654A;
  --good:#4E6630; --warn:#8A6A14; --bad:#A0472F; --bad-soft:#F5E1D8; --warn-soft:#F4EAD0; --good-soft:#E4E9D8;
  --bar:rgba(255,252,245,.84);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-script:"Pinyon Script","Snell Roundhand",cursive;
  --font-sc:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--font-display);font-size:38px;line-height:1.05;font-weight:600;margin:22px 0 4px;text-wrap:balance}
h2{font-family:var(--font-display);font-size:24px;line-height:1.15;font-weight:600;margin:28px 0 10px;text-wrap:balance;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;min-width:24px;border-top:1px solid var(--gold);opacity:.45}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.pad{padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.hidden{display:none}

.wreath h1{margin:30px 0 0 12px;color:var(--fg);font-family:var(--font-script);font-weight:400;font-size:36px;line-height:1.05;display:flex;flex-direction:column;align-items:center}
.wreath h1 .amp{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:22px;color:var(--muted);margin:-2px 0 -4px}
.wreath h1.one{font-size:30px;max-width:200px;text-wrap:balance}
.hero .sub{margin:0;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 6px}
.goldrule{width:44px;height:0;border-top:1px solid var(--gold);opacity:.8;justify-self:center}
.eyebrow{font-family:var(--font-sc);font-size:14px;letter-spacing:.1em;color:var(--muted);font-weight:600;line-height:1.25}
.display{font-family:var(--font-display);font-style:italic;font-weight:600;letter-spacing:-.01em;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.hero .total{font-size:54px}
.hero .days{font-size:24px;color:var(--copper)}
.hero .total{color:var(--accent)}
.bar-row:nth-child(4n+2) .bar-track i{background:var(--olive)}
.bar-row:nth-child(4n+3) .bar-track i{background:var(--copper)}
.bar-row:nth-child(4n+4) .bar-track i{background:var(--c-spese)}
.meter{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.meter.over i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat b{display:block;font-size:20px;font-weight:650;margin-top:2px}
@media (min-width:620px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Bars */
.bars{display:grid;gap:12px}
.bar-row{display:grid;gap:5px}
.bar-row .lbl{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.bar-track{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* Lists */
.list{display:grid}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-head{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 4px 6px 16px}
.item-main{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:10px}
.item-main .t{flex:1;min-width:0}
.item-main .t span{display:block;overflow-wrap:anywhere}
.item-main .meta{font-size:13px;color:var(--muted)}
.amount{font-weight:600;white-space:nowrap}
.x{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:22px;cursor:pointer}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.x svg{width:16px;height:16px}
.chev{width:12px;height:12px;flex:none;color:var(--muted);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.open > .item-head .chev,.open > .cat-head .chev{transform:rotate(90deg)}
.editor{padding:4px 16px 18px;display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.editor .full{grid-column:1/-1}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,8.5em) 44px;gap:6px;align-items:center}
@media (max-width:460px){.prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}.prow select{grid-column:1/3}}
.grp{display:grid;gap:8px;min-width:0}
.grp>.gl{font-size:13px;color:var(--muted);font-weight:500}
.invbox{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:460px){.invbox{grid-template-columns:minmax(0,1fr)}}
.invbox .eyebrow{grid-column:1/-1}
.codebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.codebox code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:15px;letter-spacing:.08em;background:var(--accent-soft);color:var(--accent);padding:6px 10px;border-radius:8px}
.warnline{margin:0;font-size:13px;color:var(--warn)}
.rlist{display:grid;gap:0}
.rlist .ri{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:2px}
.rlist .ri:first-child{border-top:0}

@media (max-width:460px){.editor{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--accent);margin:0}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}

/* Category */
.cat{margin-bottom:12px;overflow:hidden}
.cat-head{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 16px;min-height:60px}
.cat-head .item-main .t span:first-child{font-weight:650}
.cat-body{border-top:1px solid var(--line)}
.cat-foot{padding:8px 12px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* Buttons */
.btn{font:inherit;font-size:16px;font-weight:600;min-height:44px;padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:8px;transition:transform .1s ease-out}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.plain{background:none;padding-inline:10px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:active,.x:active,.item-main:active,.tab:active{transform:scale(.97)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* Pills */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:#75590F}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--line);color:var(--muted)}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:10px;padding:2px;margin:6px 0 16px}
.seg button{font:inherit;font-size:14px;font-weight:600;min-height:36px;border:0;border-radius:8px;background:none;color:var(--fg);cursor:pointer}
.seg button[aria-selected=true]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{font:inherit;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;min-height:50px;cursor:pointer;font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:var(--accent)}
@media (prefers-reduced-transparency: reduce){.tabbar,.toast{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface)}}
@media (prefers-contrast: more){.tabbar{background:var(--surface);border-top:2px solid var(--fg)}.card{border-color:var(--muted)}}

/* Toast */

/* ---------- stato e salvataggio ---------- */
const LS = 'conti-matrimonio-v1';
let state = defaultState();
let hasLocal = false;
try { const raw = localStorage.getItem(LS); if (raw) { state = Object.assign(defaultState(), JSON.parse(raw)); hasLocal = true; } } catch (e) {}
state.settings = Object.assign(defaultState().settings, state.settings);

const DOCS = {base:['settings','entrate'], spese:['cats'], ospiti:['guests'], checklist:['tasks']};
let db = null, syncState = 'local';
const lastJson = {}, inflight = {}, again = {}, timers = {};
const sliceJson = k => { const o = {}; DOCS[k].forEach(f => o[f] = state[f]); return JSON.stringify(o); };
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
function save(k){ saveLocal(); everSaved = true; ghTouch(); if (k === 'ospiti' || k === 'base') casSchedule(); if (!db) return; clearTimeout(timers[k]); timers[k] = setTimeout(() => { timers[k] = null; flush(k); }, 700); }
async function flush(k){
  if (inflight[k]) { again[k] = true; return; }
  const j = sliceJson(k); if (j === lastJson[k]) return;
  inflight[k] = true;
  try { await db.doc('planner/' + k).set({json:j}); lastJson[k] = j; setSync('ok'); }
  catch (e) {
    setSync('err');
    if (e && e.code === 'unavailable') setTimeout(() => flush(k), 1200 + Math.random() * 1500);
    else if (e && e.code === 'quota_exceeded') toast('Spazio di salvataggio pieno: esporta un backup da Altro › Impostazioni');
  } finally { inflight[k] = false; if (again[k]) { again[k] = false; flush(k); } }
}
function setSync(s){ syncState = s; const el = $('#sync'); if (el) { el.className = 'sync ' + s; el.lastElementChild.textContent = syncLabel(); } }
const syncLabel = () => ({local:'Salvato solo su questo dispositivo', ok: db ? 'Salvato e sincronizzato' : 'Salvato online', busy:'Salvataggio online…', err: db ? 'Sincronizzazione non riuscita, salvato qui' : 'Archivio online non raggiungibile, salvato qui', key:'Chiave GitHub non valida o scaduta, salvato qui'})[syncState];

(async () => {
  if (!window.claude || !window.claude.use) return;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) return;
  setSync('ok');
  Object.keys(DOCS).forEach(k => {
    db.doc('planner/' + k).onSnapshot(snap => {
      if (!snap.exists) { if (hasLocal) flush(k); return; }
      const d = snap.data(); const j = d && d.json; if (!j || j === lastJson[k]) return;
      if (timers[k] || inflight[k]) return; // modifiche locali in arrivo: vincono loro
      try { const o = JSON.parse(j); DOCS[k].forEach(f => { if (o[f] !== undefined) state[f] = o[f]; }); } catch (e) { return; }
      if (k === 'base') state.settings = Object.assign(defaultState().settings, state.settings);
      lastJson[k] = j; saveLocal();
      if (!isEditing()) render(); else pendingRender = true;
    }, () => setSync('err'));
  });
})();
let pendingRender = false;

/* ---------- salvataggio online su un archivio GitHub privato ---------- */
// Fuori da Claude i dati vanno in un file JSON di un archivio GitHub privato:
// iPhone e PC leggono e scrivono lo stesso file. La chiave resta solo su questo dispositivo.
const GHK = 'conti-matrimonio-github', GH_FILE = 'dati-matrimonio.json';
let gh = null; try { gh = JSON.parse(localStorage.getItem(GHK) || 'null'); } catch (e) {}
let everSaved = hasLocal, ghTimer = null, ghBusy = false, ghAgain = false, ghRev = 0, ghWhen = null, ghConflict = null;
const ghStore = () => { try { gh ? localStorage.setItem(GHK, JSON.stringify(gh)) : localStorage.removeItem(GHK); } catch (e) {} };
const b64e = t => { const b = new TextEncoder().encode(t); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = t => new TextDecoder().decode(Uint8Array.from(atob(String(t).replace(/\s/g, '')), c => c.charCodeAt(0)));
const ghDevice = () => /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'PC';
const normState = o => { const n = Object.assign(defaultState(), o); n.settings = Object.assign(defaultState().settings, o.settings); return n; };
function ghFetch(url, token, opt){
  opt = opt || {};
  return fetch(url, {method:opt.method || 'GET', cache:'no-store', headers:Object.assign({'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json'}, opt.body ? {'Content-Type':'application/json'} : {}), body:opt.body ? JSON.stringify(opt.body) : undefined});
}
const ghUrl = () => 'https://api.github.com/repos/' + gh.repo + '/contents/' + GH_FILE;

// Copia dei dati all'ultima sincronizzazione: serve per capire chi ha cambiato cosa
const GHB = 'conti-matrimonio-github-base';
let ghBase = null; try { ghBase = localStorage.getItem(GHB); } catch (e) {}
const ghSetBase = t => { ghBase = t; try { t == null ? localStorage.removeItem(GHB) : localStorage.setItem(GHB, t); } catch (e) {} };
const J = v => JSON.stringify(v === undefined ? null : v);
const FLAB = {nome:'nome', stima:'stima', prev:'preventivo', pagato:'pagato', qty:'quantità', mode:'calcolo', fornitore:'fornitore', contatto:'contatto', stato:'stato', scadenza:'scadenza', paga:'chi paga', note:'note',
  adulti:'adulti', bambini:'bambini', neonati:'neonati', membri:'componenti', rsvp:'risposta', tavolo:'tavolo', allergie:'allergie', indirizzo:'indirizzo', lato:'lato', tipo:'tipo', gruppo:'gruppo', nucleo:'nucleo',
  importo:'importo', testo:'testo', fatto:'fatto', fase:'quando', nomeA:'primo sposo/a', nomeB:'secondo sposo/a', data:'data', budget:'budget', imprevisti:'imprevisti', stimaAdulti:'adulti stimati',
  stimaBambini:'bambini stimati', usaLista:'calcolo dalla lista', sposiInclusi:'sposi a tavola', perTavolo:'posti per tavolo', bustaMedia:'busta media', listaNozze:'lista nozze', saluto:'saluto', messaggio:'messaggio', codice:'codice invito', persone:'persone dell\'invito', risposta:'risposta online', rsvpScadenza:'scadenza risposte'};
const fmtV = v => v === true ? 'sì' : v === false ? 'no' : (v === '' || v == null) ? 'vuoto' : String(v);
// Unisce campo per campo: vince chi ha cambiato; se hanno cambiato tutti e due, è un conflitto (per ora tiene il valore di qui)
function mergeObj(b, l, r, where, conf, lists){
  const out = {}; const keys = new Set([...Object.keys(b || {}), ...Object.keys(l || {}), ...Object.keys(r || {})]);
  keys.forEach(k => {
    if (lists && lists[k]) { out[k] = mergeList((b || {})[k] || [], (l || {})[k] || [], (r || {})[k] || [], lists[k], conf); return; }
    const bv = (b || {})[k], lv = (l || {})[k], rv = (r || {})[k];
    if (J(lv) === J(rv)) out[k] = lv;
    else if (J(lv) === J(bv)) out[k] = rv;
    else if (J(rv) === J(bv)) out[k] = lv;
    else { out[k] = lv; conf.push({obj:out, key:k, local:lv, remote:rv, label:where + ' › ' + (FLAB[k] || k)}); }
    if (out[k] === undefined) delete out[k];
  });
  return out;
}
function mergeList(b, l, r, spec, conf){
  const bm = new Map(b.map(x => [x.id, x])), lm = new Map(l.map(x => [x.id, x])), rm = new Map(r.map(x => [x.id, x]));
  const res = [];
  r.forEach(rx => {
    const id = rx.id, bx = bm.get(id), lx = lm.get(id);
    if (!lx) { if (bx && J(rx) === J(bx)) return; if (!bx) { res.push(rx); return; } res.push(rx); return; } // tolta qui: resta solo se l'altro l'ha cambiata
    res.push(mergeObj(bx || {}, lx, rx, spec.label(lx), conf, spec.lists));
  });
  l.forEach((lx, i) => {
    if (rm.has(lx.id)) return;
    const bx = bm.get(lx.id);
    if (bx && J(lx) === J(bx)) return; // tolta dall'altro dispositivo e qui non cambiata
    let at = 0; for (let j = i - 1; j >= 0; j--) { const p = res.findIndex(x => x.id === l[j].id); if (p > -1) { at = p + 1; break; } }
    res.splice(at, 0, lx);
  });
  return res;
}
const ITEMS = {label:x => x.nome || 'Voce'};
const SPEC = {settings:null, entrate:{label:x => 'Entrata ' + (x.nome || '')}, guests:{label:x => x.nome || 'Ospite'}, tasks:{label:x => x.testo || 'Attività'},
  cats:{label:x => x.nome || 'Categoria', lists:{items:ITEMS}}};
function merge3(b, l, r){
  const conf = []; const out = {};
  const keys = new Set([...Object.keys(b), ...Object.keys(l), ...Object.keys(r)]);
  keys.forEach(k => {
    if (k === 'settings') out[k] = mergeObj(b[k] || {}, l[k] || {}, r[k] || {}, 'Impostazioni', conf);
    else if (SPEC[k]) out[k] = mergeList(b[k] || [], l[k] || [], r[k] || [], SPEC[k], conf);
    else out[k] = J(l[k]) === J(b[k]) ? r[k] : l[k];
  });
  return {state:out, conf};
}
async function ghPull(){
  const r = await ghFetch(ghUrl(), gh.token);
  if (r.status === 404) return null;
  if (!r.ok) throw r.status;
  const j = await r.json(); return {sha:j.sha, text:b64d(j.content)};
}
async function ghPush(sha){
  const rev = ghRev;
  const text = JSON.stringify(state, null, 1);
  const body = {message:'Aggiornamento dal ' + ghDevice(), content:b64e(text)}; if (sha) body.sha = sha;
  const r = await ghFetch(ghUrl(), gh.token, {method:'PUT', body});
  if (r.status === 409 || r.status === 422) return false; // un altro dispositivo ha salvato prima
  if (!r.ok) throw r.status;
  const j = await r.json(); gh.sha = j.content.sha; gh.dirty = ghRev !== rev; ghStore(); ghSetBase(text); ghWhen = new Date();
  if (gh.dirty) ghAgain = true;
  return true;
}
function ghAdopt(text, sha){
  state = normState(JSON.parse(text)); saveLocal(); gh.sha = sha; gh.dirty = false; ghStore(); ghSetBase(text); ghWhen = new Date();
  if (!isEditing()) render(); else pendingRender = true;
}
function ghTouch(){
  if (!gh || db) return;
  gh.dirty = true; ghRev++; ghStore();

async function casCall(cas, body){

function applyRisposte(R){
  let n = 0, kept = 0;
  inviteUnits().forEach(u => {
    const r = u.codice && R[u.codice]; if (!r) return;
    const cur = u.risposta; if (cur && cur.quando === r.quando) return;
    n++;
    const byId = {}; (r.persone || []).forEach(p => byId[p.id] = p);
    const allTxt = list => list.filter(p => byId[p.id] && byId[p.id].viene && ((byId[p.id].allergie || []).length || byId[p.id].note))
      .map(p => (p.nome ? p.nome + ': ' : '') + (byId[p.id].allergie || []).join(', ') + (byId[p.id].note ? ' (' + byId[p.id].note + ')' : '')).join('; ');
    const setAll = (g, txt) => { if (!g.allergie || g.allergie === g.allergieAuto) { g.allergie = txt; g.allergieAuto = txt; } else if (txt && g.allergie !== txt) kept++; };
    const info = {presenza:r.presenza, vengono:r.presenza === 'si' ? (r.persone || []).filter(p => p.viene).length : 0, quando:r.quando, messaggio:r.messaggio || '', piuUno:r.piuUno || ''};
    if (u.fam) {
      const g = u.fam;
      g.persone = (g.persone || []).map(p => Object.assign({}, p, {viene: r.presenza === 'si' && !!(byId[p.id] && byId[p.id].viene)}));
      g.risposta = info;
      g.rsvp = r.presenza === 'si' && g.persone.some(p => p.viene) ? 'si' : 'no';
      setAll(g, allTxt(u.persone));
    } else {
      u.list.forEach(g => {
        const p = byId[g.id]; g.risposta = info;
        g.rsvp = r.presenza === 'si' && p && p.viene ? 'si' : 'no';
        setAll(g, allTxt(u.persone.filter(x => x.id === g.id)));

    }
  });

}

function vPareggio(T){
  const sp = S().sposiInclusi ? 2 : 0;

  const B = num(S().bustaMedia);
  const at = x => totals(counts(x + sp));                  // x = adulti invitati
  // costo di un adulto in più (con la sua quota di bambini, tavoli e imprevisti)
  const base = Math.max(10, ext);
  const marg = (at(base + 20).tot - at(base).tot) / 20;
  const m = B - marg;                                       // quanto "rende" o "costa" ogni invitato
  const gap = T.netto;                                      // > 0: manca; < 0: avanza
  let be = null; for (let x = 1; x <= 600; x++) { if (at(x).netto <= 0) { be = x; break; } }
  const bNeed = ext ? Math.max(0, (T.tot - fissi) / ext) : 0;
  // grafico
  const X0 = 20, X1 = 300, pts = []; for (let x = X0; x <= X1; x += 10) { const t = at(x); pts.push({x, s:t.tot, e:t.entrate}); }
  const maxY = Math.max(...pts.map(p => Math.max(p.s, p.e)), 1);
  const step = [5000, 10000, 20000, 25000, 50000].find(v => maxY / v <= 5) || 100000; const top = Math.ceil(maxY / step) * step;
  const W = 600, Hh = 250, L = 56, Rr = 16, Tt = 14, Bb = 34;
  const sx = x => L + (x - X0) / (X1 - X0) * (W - L - Rr), sy = v => Tt + (1 - v / top) * (Hh - Tt - Bb);
  const path = k => pts.map((p, i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p[k]).toFixed(1)).join(' ');
  const yt = []; for (let v = 0; v <= top; v += step) yt.push(v);
  const kfmt = v => v >= 1000 ? (v / 1000).toLocaleString('it-IT') + 'k €' : v + ' €';
  const cx = Math.min(X1, Math.max(X0, ext));
  const svg = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Spese ed entrate al variare degli adulti invitati" style="display:block;font-family:var(--font-ui)">
    ${yt.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${sy(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${kfmt(v)}</text>`).join('')}
    ${[50, 100, 150, 200, 250, 300].map(x => `<text x="${sx(x)}" y="${Hh - 12}" text-anchor="middle" font-size="12" fill="var(--muted)">${x}</text>`).join('')}
    ${be && be >= X0 && be <= X1 ? `<line x1="${sx(be)}" x2="${sx(be)}" y1="${Tt}" y2="${Hh - Bb}" stroke="var(--c-entrate)" stroke-width="1.5" stroke-dasharray="4 4"/>` : ''}

function vScadenze(){
  const c = counts(); const today = new Date().toISOString().slice(0, 10);

  rows.sort((a, b) => (a.it.scadenza || '9999') .localeCompare(b.it.scadenza || '9999') || b.r - a.r);
  const dated = rows.filter(x => x.it.scadenza), undated = rows.filter(x => !x.it.scadenza);
  const late = dated.filter(x => x.it.scadenza < today), soon = dated.filter(x => x.it.scadenza >= today && x.it.scadenza <= in30);
  const sum = a => a.reduce((s, x) => s + x.r, 0);

  return `<h1>Scadenze</h1><p class="sub">Restano da pagare <b class="num">${fmt(sum(rows))}</b>${late.length ? ` · <span style="color:var(--bad)">${late.length} scadute</span>` : ''}</p>

    case 'del-cat': { const i = state.cats.findIndex(c => c.id === id); const old = state.cats[i]; state.cats.splice(i, 1); save('spese'); render(); toast('Categoria «' + old.nome + '» rimossa', () => { state.cats.splice(i, 0, old); save('spese'); render(); }); break; }

    case 'add-item': { const cat = state.cats.find(c => c.id === id); const it = I('u-' + uid(), 'Nuova voce', 'fisso', 0); cat.items.push(it); ui.openItem = it.id; save('spese'); render(); const el = document.getElementById('n-' + it.id); if (el) { el.focus(); el.select(); } break; }
    case 'add-cat': { const cat = {id:'u-' + uid(), nome:'Nuova categoria', items:[]}; state.cats.push(cat); ui.openCats.add(cat.id); save('spese'); render(); { const inp = document.getElementById('rc-' + cat.id); if (inp) { inp.focus(); inp.select(); } } break; }
    case 'restore': { const def = defaultCats(); const have = new Set(); state.cats.forEach(c => c.items.forEach(i => have.add(i.id)));
      def.forEach(dc => { let cat = state.cats.find(c => c.id === dc.id); const miss = dc.items.filter(i => !have.has(i.id)); if (!miss.length) return; if (!cat) { cat = {id:dc.id, nome:dc.nome, items:[]}; state.cats.push(cat); } miss.forEach(i => cat.items.push(i)); });

    case 'p-fill': { const g = state.guests.find(x => x.id === id); const z = size(g); const cg = famSurname(g);

        return {id:uid(), nome:w.length > 1 && w[w.length - 1].toLowerCase() === cg.toLowerCase() ? w.slice(0, -1).join(' ') : nm, cognome:cg, tipo}; });
      save('ospiti'); render(); toast('Create ' + g.persone.length + ' persone: controlla cognomi ed età'); break; }
    case 'p-sync': { const g = state.guests.find(x => x.id === id); const P = g.persone || []; const old = {a:g.adulti, b:g.bambini, n:g.neonati};
      g.adulti = P.filter(p => p.tipo === 'adulto').length; g.bambini = P.filter(p => p.tipo === 'bambino').length; g.neonati = P.filter(p => p.tipo === 'neonato').length;

    case 'aseg': ui.altroSeg = id; ui.preview = null; render(); break;
    case 'add-guest': { const g = {id:uid(), nome:'', nucleo:'', gruppo:'', lato:'entrambi', tipo:'adulto', rsvp:'attesa', indirizzo:'', contatto:'', allergie:'', tavolo:''}; state.guests.unshift(g); ui.openGuest = g.id; ui.q = ''; save('ospiti'); render(); const el = document.getElementById('gn-' + g.id); if (el) el.focus(); break; }
    case 'add-fam': { const g = {id:uid(), kind:'famiglia', nome:'Famiglia ', adulti:2, bambini:0, neonati:0, membri:'', nucleo:'', gruppo:'', lato:'entrambi', tipo:'adulto', rsvp:'attesa', indirizzo:'', contatto:'', allergie:'', tavolo:''}; state.guests.unshift(g); ui.openGuest = g.id; ui.q = ''; save('ospiti'); render(); const el = document.getElementById('gn-' + g.id); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {} } break; }
    case 'bulk': ui.bulk = !ui.bulk; render(); if (ui.bulk) $('#bulkTxt').focus(); break;
    case 'bulk-add': { const lines = $('#bulkTxt').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean); let n = 0;
      lines.forEach(l => { const fm = l.match(/^(famiglia\s+.+?)\s+(\d+)(?:\s*\+\s*(\d+))?$/i);
        if (fm) { state.guests.push({id:uid(), kind:'famiglia', nome:fm[1].replace(/^famiglia/i, 'Famiglia'), adulti:+fm[2], bambini:+(fm[3] || 0), neonati:0, membri:'', nucleo:'', gruppo:'', lato:'entrambi', tipo:'adulto', rsvp:'attesa', indirizzo:'', contatto:'', allergie:'', tavolo:''}); n++; return; }
        const names = l.split(',').map(s => s.trim()).filter(Boolean); const nucleo = names.length > 1 ? 'Famiglia ' + (names[0].split(' ').slice(-1)[0]) : '';
        names.forEach(nm => { state.guests.push({id:uid(), nome:nm, nucleo, gruppo:'', lato:'entrambi', tipo:'adulto', rsvp:'attesa', indirizzo:'', contatto:'', allergie:'', tavolo:''}); n++; }); });
      ui.bulk = false; save('ospiti'); render(); toast(n + (n === 1 ? ' voce aggiunta' : ' voci aggiunte')); break; }
    case 'del-guest': { const i = state.guests.findIndex(g => g.id === id); const old = state.guests[i]; state.guests.splice(i, 1); save('ospiti'); render(); toast((old.nome || 'Ospite') + ' rimosso', () => { state.guests.splice(i, 0, old); save('ospiti'); render(); }); break; }
    case 'goto-item': { ui.tab = 'spese'; ui.openCats.add(b.dataset.cat); ui.openItem = id; render(); const el = document.getElementById('sc-' + id); if (el) { el.scrollIntoView({block:'center'}); el.focus({preventScroll:true}); } break; }
    case 'paid': { const f = findItem(id); const prevPaid = f.it.pagato, prevStato = f.it.stato; f.it.pagato = Math.round(cost(f.it, counts()) * 100) / 100; f.it.stato = 'saldato'; save('spese'); render(); toast('«' + f.it.nome + '» saldato', () => { f.it.pagato = prevPaid; f.it.stato = prevStato; save('spese'); render(); }); break; }
    case 'add-entrata': state.entrate.push({id:uid(), nome:'', importo:''}); save('base'); render(); { const el = document.getElementById('en-' + state.entrate[state.entrate.length - 1].id); if (el) el.focus(); } break;
    case 'del-entrata': { const i = state.entrate.findIndex(x => x.id === id); const old = state.entrate[i]; state.entrate.splice(i, 1); save('base'); render(); toast('Contributo rimosso', () => { state.entrate.splice(i, 0, old); save('base'); render(); }); break; }
    case 'del-task': { const i = state.tasks.findIndex(x => x.id === id); const old = state.tasks[i]; state.tasks.splice(i, 1); save('checklist'); render(); toast('Attività rimossa', () => { state.tasks.splice(i, 0, old); save('checklist'); render(); }); break; }
    case 'add-task': { const t = $('#ntxt').value.trim(); if (!t) { $('#ntxt').focus(); return; } const fase = $('#nfase').value; let idx = -1; state.tasks.forEach((x, i) => { if (x.fase === fase) idx = i; }); state.tasks.splice(idx + 1, 0, {id:uid(), fase, testo:t, fatto:false}); save('checklist'); render(); toast('Attività aggiunta'); break; }
    case 'gh-connect': ghConnect(); break;
    case 'gh-sync': ghSync(); toast('Controllo l\'archivio online…'); break;
    case 'gh-off': ui.ghOff = true; render(); break;
    case 'gh-off-no': ui.ghOff = false; render(); break;
    case 'gh-off-yes': ghDisconnect(); break;
    case 'paste': ui.paste = !ui.paste; render(); if (ui.paste) $('#pasteTxt').focus(); break;
    case 'paste-go': { const v = $('#pasteTxt').value; if (!v.trim()) { $('#pasteTxt').focus(); return; } importText(v, 'Il testo non è un backup completo: copia tutto, dalla prima { all\'ultima }'); break; }
    case 'reset': ui.confirmReset = true; render(); break;
    case 'reset-no': ui.confirmReset = false; render(); break;
    case 'reset-yes': { const old = clone(state); state = defaultState(); ui.confirmReset = false; Object.keys(DOCS).forEach(save); render(); toast('Dati cancellati', () => { state = old; Object.keys(DOCS).forEach(save); render(); }); break; }
    case 'copy': { const ta = $('#prevTxt'); const txt = ta.value; const ok = () => toast('Copiato negli appunti'); const fb = () => { ta.focus(); ta.select(); toast('Testo selezionato: copialo con Ctrl+C'); };
      try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (_) { fb(); } break; }
    case 'close-prev': ui.preview = null; render(); break;
    default: if (act && act.startsWith('exp-')) { const f = exporter(act); if (f) offer(f); }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ghRepo') { ui.ghRepo = t.value; return; }
  if (t.id === 'ghTok') { ui.ghTok = t.value; return; }
  if (t.id === 'casUrl') { ui.casUrl = t.value; return; }
  if (t.id === 'casSec') { ui.casSec = t.value; return; }
  if (t.dataset.p) { const g = state.guests.find(x => x.id === t.dataset.id); const p = g && (g.persone || [])[+t.dataset.i]; if (p) { p[t.dataset.p] = t.value; save('ospiti'); if (t.dataset.p === 'tipo') render(); } return; }
  if (t.dataset.act === 'scen') { ui.scen = +t.value; const o = $('#scenOut'); if (o) o.innerHTML = scenOut(ui.scen); return; }
  if (t.dataset.act === 'q') { ui.q = t.value; render(); return; }
  if (t.dataset.item) { const f = findItem(t.dataset.item); if (!f) return; const k = t.dataset.f; f.it[k] = k === 'prev' ? (t.value === '' ? '' : num(t.value)) : NUMF.has(k) ? num(t.value) : t.value; save('spese'); return; }
  if (t.dataset.g) { const g = state.guests.find(x => x.id === t.dataset.id); if (g) { const k = t.dataset.g; g[k] = ['adulti','bambini','neonati'].includes(k) ? Math.max(0, Math.round(num(t.value))) : t.value; save('ospiti'); } return; }
  if (t.dataset.e) { const x = state.entrate.find(y => y.id === t.dataset.id); if (x) { x[t.dataset.e] = t.dataset.e === 'importo' ? num(t.value) : t.value; save('base'); } return; }
  if (t.dataset.s && t.type !== 'checkbox') { const k = t.dataset.s; state.settings[k] = NUMF.has(k) ? num(t.value) : t.value; save('base'); return; }
  if (t.dataset.rencat) { const c = state.cats.find(x => x.id === t.dataset.rencat); if (c) { c.nome = t.value; save('spese'); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'task') { const x = state.tasks.find(y => y.id === t.dataset.id); x.fatto = t.checked; save('checklist'); render(); return; }
  if (t.dataset.s && t.type === 'checkbox') { state.settings[t.dataset.s] = t.checked; save('base'); render(); return; }
  if (t.dataset.act === 'imp') { const file = t.files && t.files[0]; if (!file) return; const r = new FileReader();
    r.onload = () => { importText(r.result, 'Questo file non è un backup del matrimonio: scegli il file esportato da qui'); t.value = ''; };
    r.readAsText(file); return; }
  if (t.dataset.rencat || (t.matches('input,select,textarea') && (t.dataset.item || t.dataset.g || t.dataset.e || t.dataset.s))) setTimeout(render, 0);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ghTok') ghConnect(); if (e.key === 'Enter' && e.target.dataset && e.target.dataset.rencat) e.target.blur(); if (e.key === 'Enter' && e.target.id === 'ntxt') document.querySelector('[data-act="add-task"]').click(); });

document.body.insertAdjacentHTML('beforeend', '<div id="dl"></div>');
const renderDL = () => { $('#dl').innerHTML = datalists(); };
const _render = render; render = function(){ _render(); renderDL(); };
render();
})();
</script>

<div id="ptr" aria-hidden="true"><div class="ptr-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6 12l6 6 6-6"/></svg></div><span id="ptrTxt">Trascina per aggiornare</span></div>
<div id="upd" class="upd" role="status" hidden><span>È disponibile una nuova versione</span><button type="button" id="updBtn">Aggiorna</button></div>
<style>
html,body{overscroll-behavior-y:none}
#ptr{position:fixed;left:0;right:0;top:0;z-index:40;display:grid;justify-items:center;gap:6px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateY(-110%);pointer-events:none;color:var(--accent);font-size:13px;font-weight:600;will-change:transform}
#ptr.back{transition:transform .4s cubic-bezier(.2,.9,.25,1)}
.ptr-dot{width:36px;height:36px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px rgba(46,53,40,.12)}
.ptr-dot svg{width:18px;height:18px;transition:transform .2s ease-out}
#ptr.ready .ptr-dot svg{transform:rotate(180deg)}
#ptr.busy .ptr-dot svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.upd{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:41;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:6px 6px 6px 14px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(46,53,40,.2)}
.upd button{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--accent-fg);color:var(--accent);min-height:40px;padding:0 14px;cursor:pointer}
@media (prefers-reduced-motion: reduce){#ptr.back{transition:none}.ptr-dot svg{transition:none}#ptr.busy .ptr-dot svg{animation:none}}
</style>
<script>
(() => {
  'use strict';
  const VERSION = document.querySelector('meta[name="app-version"]').content;
  const fresh = () => { const u = new URL(location.href); u.search = '?v=' + Date.now(); u.hash = location.hash; location.replace(u.toString()); };
  // Controllo automatico all'apertura e al ritorno sull'app
  async function check(){
    try { const r = await fetch('./sposi.html?check=' + Date.now(), {cache:'no-store'}); if (!r.ok) return;
      const t = await r.text(); const m = t.match(/name="app-version" content="([^"]+)"/);
      if (m && m[1] !== VERSION) document.getElementById('upd').hidden = false; } catch (e) {}
  }
  document.getElementById('updBtn').addEventListener('click', fresh);
  check(); document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });

  // Trascina verso il basso per aggiornare
  const ptr = document.getElementById('ptr'), txt = document.getElementById('ptrTxt');
  const H = 76; // soglia in px
  const rubber = (x, d = 220, c = 0.55) => (x * d * c) / (d + c * x);
  let y0 = null, x0 = 0, dy = 0, active = false, decided = false;
  const set = v => { ptr.style.transform = 'translateY(calc(-110% + ' + v + 'px))'; };
  window.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || window.scrollY > 0 || ptr.classList.contains('busy')) { y0 = null; return; }
    const el = e.target; if (el.closest && el.closest('input,textarea,select,[type=range]')) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; active = false; decided = false;
  }, {passive:true});
  window.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const t = e.touches[0]; const d = t.clientY - y0, dx = Math.abs(t.clientX - x0);
    if (!decided) { if (Math.abs(d) < 10 && dx < 10) return; decided = true; if (d <= 0 || dx > Math.abs(d) || window.scrollY > 0) { y0 = null; return; } active = true; ptr.classList.remove('back'); }
    if (!active) return;
    e.preventDefault();
    dy = Math.max(0, d); const v = rubber(dy); set(v + 60);
    const ready = v >= H * 0.75; ptr.classList.toggle('ready', ready); txt.textContent = ready ? 'Rilascia per aggiornare' : 'Trascina per aggiornare';
  }, {passive:false});
  const end = () => {
    if (!active) { y0 = null; return; }
    active = false; y0 = null; ptr.classList.add('back');
    if (ptr.classList.contains('ready')) { ptr.classList.remove('ready'); ptr.classList.add('busy'); txt.textContent = 'Aggiornamento…'; set(60 + H * 0.75); setTimeout(fresh, 250); }
    else ptr.style.transform = '';
  };
  window.addEventListener('touchend', end); window.addEventListener('touchcancel', end);
})();
</script>
